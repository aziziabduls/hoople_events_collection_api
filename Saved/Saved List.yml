info:
  name: Saved List
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/saved"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

