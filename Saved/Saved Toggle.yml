http:
  method: POST
  url: "{{baseUrl}}/saved/toggle"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "kind": "activity",
        "experienceId": "a1b2c3d4-1111-4a2b-8c3d-000000000101"
      }

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Aktivitas disimpan",
            "data": {
              "kind": "activity",
              "experienceId": "a1b2c3d4-1111-4a2b-8c3d-000000000101",
              "isSaved": true,
              "savedAt": "2026-03-14T09:30:00+07:00",
              "savedTotal": 4
            },
            "meta": null
          }

docs: |-
  # Saved Toggle

  Simpan/lepas. Idempoten, mengembalikan `isSaved` terbaru.

  | | |
  | --- | --- |
  | **Method** | `POST` |
  | **Path** | `/saved/toggle` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/saved/saved-toggle.request.json`<br>`dto/saved/saved-toggle.response.json` |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `kind` | string | ya | enum `experienceKind`: `event`, `activity` |
  | `experienceId` | string | ya | UUID v4 |


  > Kolom **Wajib** diturunkan dari contoh: field yang bernilai `null`
  > dianggap opsional. Aturan validasi sesungguhnya ditentukan backend.

  ## Response `200`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": null }
  ```

  Isi `data`:

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `kind` | string | tidak | enum `experienceKind`: `event`, `activity` |
  | `experienceId` | string | tidak | UUID v4 |
  | `isSaved` | boolean | tidak |  |
  | `savedAt` | string | tidak | ISO 8601 `+07:00` |
  | `savedTotal` | integer | tidak |  |

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `422` | `common/error-validation.response.json` | Validasi gagal; pesan per field ada di `error.errors`. |
  | `500` | `common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.

  Selengkapnya di `dto/README.md`.

