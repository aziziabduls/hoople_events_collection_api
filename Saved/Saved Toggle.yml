info:
  name: Saved Toggle
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/saved/toggle"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "kind": "activity",
        "experienceId": "a1b2c3d4-1111-4a2b-8c3d-000000000101"
      }

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Aktivitas disimpan",
            "data": {
              "kind": "activity",
              "experienceId": "a1b2c3d4-1111-4a2b-8c3d-000000000101",
              "isSaved": true,
              "savedAt": "2026-03-14T09:30:00+07:00",
              "savedTotal": 4
            },
            "meta": null
          }

docs: |-
  ## Saved Toggle

  Simpan/lepas. Idempoten, mengembalikan `isSaved` terbaru.

  **POST** `/saved/toggle`

  - Request: `dto/saved/saved-toggle.request.json`
  - Response: `dto/saved/saved-toggle.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
