docs: |-
  ## Activity Sessions

  Sesi bookable pada rentang tanggal.

  **GET** `/activities/{slug}/sessions?from=&to=`

  - Response: `dto/catalog/activity-sessions.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

