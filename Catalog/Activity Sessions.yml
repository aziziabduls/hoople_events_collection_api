  name: Activity Sessions
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/activities/{slug}/sessions?from=2026-03-16&to=2026-03-31"
  auth: none
  params:
    - name: from
      value: "2026-03-16"
      type: query
    - name: to
      value: "2026-03-31"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

