info:
  name: Community List
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/communities"
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

