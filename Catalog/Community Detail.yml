info:
  name: Community Detail
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/communities/{slug}"
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

