docs: |-
  ## Community Detail

  Profil komunitas + experience mendatang.

  **GET** `/communities/{slug}`

  - Response: `dto/catalog/community-detail.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
