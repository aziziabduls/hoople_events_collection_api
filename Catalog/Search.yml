info:
  name: Search
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/search?q=yoga&category=wellness&city=Jakarta%20Selatan"
  auth: none
  params:
    - name: q
      value: yoga
      type: query
    - name: category
      value: wellness
      type: query
    - name: city
      value: Jakarta Selatan
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
