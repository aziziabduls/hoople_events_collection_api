docs: |-
  ## Search

  Hasil pencarian + facet filter.

  **GET** `/search?q=&category=&city=`

  - Response: `dto/catalog/search.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
