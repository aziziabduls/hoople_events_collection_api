docs: |-
  # Activity Detail

  Detail lengkap + ulasan + FAQ.

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/activities/{slug}` |
  | **Auth** | Tidak perlu (publik) |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/catalog/activity-detail.response.json` |

  ## Path parameter

  | Nama | Catatan |
  | --- | --- |
  | `{slug}` | Slug publik, mis. `morning-yoga-flow`. |

  ## Request body

  Tidak ada.

  ## Response `200`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": null }
  ```

  Isi `data`:

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `id` | string | tidak | UUID v4 |
  | `slug` | string | tidak |  |
  | `title` | string | tidak |  |
  | `kind` | string | tidak | enum `experienceKind`: `event`, `activity` |
  | `host` | object | tidak |  |
  | `host.id` | string | tidak | UUID v4 |
  | `host.name` | string | tidak |  |
  | `host.slug` | string | tidak |  |
  | `host.avatarUrl` | string | tidak | URL |
  | `host.verified` | boolean | tidak |  |
  | `host.rating` | number | tidak |  |
  | `host.experienceCount` | integer | tidak |  |
  | `host.bio` | string | tidak |  |
  | `category` | string | tidak |  |
  | `categoryLabel` | string | tidak |  |
  | `badge` | string | tidak |  |
  | `summary` | string | tidak |  |
  | `coverImageUrl` | string | tidak | URL |
  | `rating` | number | tidak |  |
  | `reviewCount` | integer | tidak |  |
  | `priceFrom` | money | tidak | `{ amount: integer, currency: "IDR" }` |
  | `isFree` | boolean | tidak |  |
  | `recurrence` | string | tidak |  |
  | `recurrenceTime` | string | tidak |  |
  | `durationMinutes` | integer | tidak |  |
  | `level` | string | tidak |  |
  | `joinedCount` | integer | tidak |  |
  | `venue` | object | tidak |  |
  | `venue.name` | string | tidak |  |
  | `venue.area` | string | tidak |  |
  | `venue.city` | string | tidak |  |
  | `venue.address` | string | tidak |  |
  | `venue.latitude` | number | tidak |  |
  | `venue.longitude` | number | tidak |  |
  | `venue.notes` | string[] | tidak |  |
  | `isSaved` | boolean | tidak |  |
  | `soldOut` | boolean | tidak |  |
  | `nextSessionAt` | string | tidak | ISO 8601 `+07:00` |
  | `description` | string | tidak |  |
  | `learn` | string | tidak |  |
  | `includes` | string | tidak |  |
  | `language` | string | tidak |  |
  | `classSize` | string | tidak |  |
  | `highlights` | string[] | tidak |  |
  | `tags` | string[] | tidak |  |
  | `galleryImageUrls` | string[] | tidak |  |
  | `bring` | object[] | tidak |  |
  | `bring[].title` | string | tidak |  |
  | `bring[].detail` | string | tidak |  |
  | `closedWeekdays` | number[] | tidak |  |
  | `faqs` | object[] | tidak |  |
  | `faqs[].question` | string | tidak |  |
  | `faqs[].answer` | string | tidak |  |
  | `reviews` | object[] | tidak |  |
  | `reviews[].id` | string | tidak | UUID v4 |
  | `reviews[].author` | string | tidak |  |
  | `reviews[].avatarUrl` | string | ya | boleh `null` |
  | `reviews[].rating` | integer | tidak |  |
  | `reviews[].body` | string | tidak |  |
  | `reviews[].createdAt` | string | tidak | ISO 8601 `+07:00` |

  _+10 field lagi — lihat contoh JSON di bawah._

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `404` | `common/error-not-found.response.json` | Id atau slug tidak ditemukan. |
  | `500` | `common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.

  Selengkapnya di `dto/README.md`.

