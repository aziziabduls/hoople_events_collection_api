info:
  name: Event Detail
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/events/{slug}"
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

