docs: |-
  ## Event List

  Daftar event (sekali jalan).

  **GET** `/events`

  - Response: `dto/catalog/event-list.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
