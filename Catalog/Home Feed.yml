docs: |-
  ## Home Feed

  Hero + section beranda + kategori.

  **GET** `/home`

  - Response: `dto/catalog/home-feed.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
