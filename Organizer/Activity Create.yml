docs: |-
  ## Activity Create

  Submit builder aktivitas (5 langkah).

  **POST** `/organizer/experiences/activities`

  - Request: `dto/organizer/activity-create.request.json`
  - Response: `dto/organizer/activity-create.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

