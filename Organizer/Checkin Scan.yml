docs: |-
  # Checkin Scan

  Scan QR di pintu.

  | | |
  | --- | --- |
  | **Method** | `POST` |
  | **Path** | `/organizer/check-in/scan` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/organizer/checkin-scan.request.json`<br>`dto/organizer/checkin-scan.response.json` |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `ticketCode` | string | ya |  |
  | `sessionId` | string | ya |  |
  | `scannedAt` | string | ya | ISO 8601 `+07:00` |


  > Kolom **Wajib** diturunkan dari contoh: field yang bernilai `null`
  > dianggap opsional. Aturan validasi sesungguhnya ditentukan backend.

  ## Response `200`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": null }
  ```

  Isi `data`:

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `result` | string | tidak | enum `scanResult`: `accepted`, `already_used`, `invalid`, `expired`, `wrong_event` |
  | `ticketCode` | string | tidak |  |
  | `registrationId` | string | tidak |  |
  | `participant` | object | tidak |  |
  | `participant.name` | string | tidak |  |
  | `participant.email` | string | tidak | email |
  | `experienceTitle` | string | tidak |  |
  | `sessionStartsAt` | string | tidak | ISO 8601 `+07:00` |
  | `checkedInAt` | string | tidak | ISO 8601 `+07:00` |
  | `sessionProgress` | object | tidak |  |
  | `sessionProgress.checkedIn` | integer | tidak |  |
  | `sessionProgress.booked` | integer | tidak |  |
  | `sessionProgress.capacity` | integer | tidak |  |

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `422` | `common/error-validation.response.json` | Validasi gagal; pesan per field ada di `error.errors`. |
  | `409` | `organizer/checkin-scan-rejected.response.json` | Tiket sudah dipakai check-in. |
  | `403` | `common/error-forbidden.response.json` | Akun tidak punya peran untuk konsol ini. |
  | `500` | `common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.

  Selengkapnya di `dto/README.md`.

