docs: |-
  ## Registration List

  Registrasi + status bayar + kehadiran.

  **GET** `/organizer/registrations`

  - Response: `dto/organizer/registration-list.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

