docs: |-
  ## Event Create

  Submit builder event (4 langkah).

  **POST** `/organizer/experiences/events`

  - Request: `dto/organizer/event-create.request.json`
  - Response: `dto/organizer/event-create.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

