info:
  name: Settings
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/organizer/settings"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

