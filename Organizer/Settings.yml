docs: |-
  ## Settings

  Workspace, rekening, fee, paket, notifikasi.

  **GET** `/organizer/settings`

  - Response: `dto/organizer/settings.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
