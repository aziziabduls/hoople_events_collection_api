docs: |-
  ## Transaction List

  Buku transaksi: `sale`, `refund`, `payout`.

  **GET** `/organizer/transactions`

  - Response: `dto/organizer/transaction-list.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

