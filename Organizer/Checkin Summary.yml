info:
  name: Checkin Summary
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/organizer/check-in/summary?sessionId=ses-0001-4aaa-8bbb-000000000001"
  auth: inherit
  params:
    - name: sessionId
      value: ses-0001-4aaa-8bbb-000000000001
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Ringkasan check-in berhasil diambil",
            "data": {
              "sessionId": "ses-0001-4aaa-8bbb-000000000001",
              "experienceTitle": "Morning Yoga Flow",
              "startsAt": "2026-03-16T07:00:00+07:00",
              "booked": 24,
              "checkedIn": 18,
              "noShow": 2,
              "pending": 4,
              "checkInRate": 0.75,
              "recentScans": [
                {
                  "ticketCode": "HPL-8K2M-4QX7-1",
                  "name": "Adriani Ajeng",
                  "checkedInAt": "2026-03-16T06:52:00+07:00"
                },
                {
                  "ticketCode": "HPL-2M9X-7KL3-1",
                  "name": "Sinta Wijaya",
                  "checkedInAt": "2026-03-16T06:49:00+07:00"
                }
              ]
            },
            "meta": null
          }

docs: |-
  ## Checkin Summary

  Progres check-in sesi berjalan.

  **GET** `/organizer/check-in/summary?sessionId=`

  - Response: `dto/organizer/checkin-summary.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
