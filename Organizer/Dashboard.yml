docs: |-
  # Dashboard

  Kartu statistik, sesi mendatang, registrasi terbaru, tren.

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/organizer/dashboard` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/organizer/dashboard.response.json` |

  ## Request body

  Tidak ada.

  ## Response `200`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": null }
  ```

  Isi `data`:

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `workspace` | object | tidak |  |
  | `workspace.id` | string | tidak | UUID v4 |
  | `workspace.name` | string | tidak |  |
  | `workspace.category` | string | tidak |  |
  | `workspace.plan` | string | tidak |  |
  | `workspace.initials` | string | tidak |  |
  | `workspace.role` | string | tidak | enum `workspaceRole`: `owner`, `admin`, `staff` |
  | `workspace.logoUrl` | string | ya | boleh `null` |
  | `period` | object | tidak |  |
  | `period.from` | string | tidak | ISO 8601 `+07:00` |
  | `period.to` | string | tidak | ISO 8601 `+07:00` |
  | `period.label` | string | tidak |  |
  | `stats` | object[] | tidak |  |
  | `stats[].key` | string | tidak |  |
  | `stats[].label` | string | tidak |  |
  | `stats[].value` | integer | tidak |  |
  | `stats[].unit` | string | tidak | enum `statUnit`: `count`, `idr`, `rate` |
  | `stats[].deltaRate` | number | tidak |  |
  | `stats[].deltaLabel` | string | tidak |  |
  | `upcomingSessions` | object[] | tidak |  |
  | `upcomingSessions[].id` | string | tidak |  |
  | `upcomingSessions[].experienceId` | string | tidak | UUID v4 |
  | `upcomingSessions[].experienceTitle` | string | tidak |  |
  | `upcomingSessions[].kind` | string | tidak | enum `experienceKind`: `event`, `activity` |
  | `upcomingSessions[].startsAt` | string | tidak | ISO 8601 `+07:00` |
  | `upcomingSessions[].endsAt` | string | tidak | ISO 8601 `+07:00` |
  | `upcomingSessions[].coach` | string | tidak |  |
  | `upcomingSessions[].room` | string | tidak |  |
  | `upcomingSessions[].bookedCount` | integer | tidak |  |
  | `upcomingSessions[].capacity` | integer | tidak |  |
  | `recentRegistrations` | object[] | tidak |  |
  | `recentRegistrations[].id` | string | tidak |  |
  | `recentRegistrations[].participantName` | string | tidak |  |
  | `recentRegistrations[].experienceTitle` | string | tidak |  |
  | `recentRegistrations[].quantity` | integer | tidak |  |
  | `recentRegistrations[].amount` | money | tidak | `{ amount: integer, currency: "IDR" }` |
  | `recentRegistrations[].status` | string | tidak | enum `bookingStatus`: `pending`, `confirmed`, `completed`, `cancelled`, `refunded` |
  | `recentRegistrations[].createdAt` | string | tidak | ISO 8601 `+07:00` |
  | `revenueTrend` | object[] | tidak |  |
  | `revenueTrend[].period` | string | tidak |  |
  | `revenueTrend[].registrations` | integer | tidak |  |
  | `revenueTrend[].revenue` | money | tidak | `{ amount: integer, currency: "IDR" }` |
  | `pendingActions` | object[] | tidak |  |
  | `pendingActions[].key` | string | tidak |  |
  | `pendingActions[].label` | string | tidak |  |
  | `pendingActions[].count` | integer | tidak |  |
  | `pendingActions[].href` | string | tidak |  |

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `403` | `common/error-forbidden.response.json` | Akun tidak punya peran untuk konsol ini. |
  | `500` | `common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.

  Selengkapnya di `dto/README.md`.

