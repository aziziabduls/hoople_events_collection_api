docs: |-
  ## Dashboard

  Kartu statistik, sesi mendatang, registrasi terbaru, tren.

  **GET** `/organizer/dashboard`

  - Response: `dto/organizer/dashboard.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
