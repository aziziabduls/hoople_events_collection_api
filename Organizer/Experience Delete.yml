info:
  name: Experience Delete
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{baseUrl}}/organizer/experiences/{id}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Experience berhasil dihapus",
            "data": {
              "id": "e1f2a3b4-5555-4c5d-9e6f-000000000205",
              "deletedAt": "2026-03-14T09:30:00+07:00"
            },
            "meta": null
          }

docs: |-
  ## Experience Delete

  Hapus (soft delete).

  **DELETE** `/organizer/experiences/{id}`

  - Response: `dto/organizer/experience-delete.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
