name: "Local Host"
variables:
  - name: baseUrl
    value: "http://localhost:3000"
    description: "Server lokal di mesin sendiri. Belum memakai prefix versi — kalau backend lokal menyajikan /v1, tambahkan di sini."
  - name: accessToken
    value: ""
    description: "Bearer token. Diisi otomatis oleh Admin > Auth > Login."
  - name: refreshToken
    value: ""
    description: "Diisi otomatis oleh Login; dipakai body Auth > Refresh."
  - name: experienceId
    value: ""
    description: "UUID experience untuk path param. Ambil dari Experience List."
  - name: sessionId
    value: ""
    description: "UUID sesi untuk path param / query. Ambil dari Session List."
