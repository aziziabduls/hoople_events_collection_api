    value: "https://api-staging.hoople.id/v1"
    description: "Staging bersama. Satu-satunya yang memakai prefix /v1, dan prefix itu sudah termasuk di nilai ini."
  - name: accessToken
    value: ""
    description: "Bearer token. Diisi otomatis oleh Admin > Auth > Login."
  - name: refreshToken
    value: ""
    description: "Diisi otomatis oleh Login; dipakai body Auth > Refresh."
  - name: experienceId
    value: ""
    description: "UUID experience untuk path param. Ambil dari Experience List."
  - name: sessionId
    value: ""
    description: "UUID sesi untuk path param / query. Ambil dari Session List."
