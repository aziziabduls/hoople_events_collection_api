info:
  name: Upload
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/media/upload"
  auth: inherit
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: []
      - name: purpose
        type: text
        value: cover

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Gambar berhasil diunggah",
            "data": {
              "url": "https://cdn.hoople.id/uploads/2026/03/cover-8f2a1c9d4b.jpg"
            },
            "meta": null
          }

docs: |-
  ## Upload

  Unggah gambar (cover, galeri, logo, avatar). Mengembalikan `url` yang dipakai payload builder.

  **POST** `/media/upload`

  - Response: `dto/media/upload.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
