info:
  name: Eticket
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/bookings/{id}/ticket"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

