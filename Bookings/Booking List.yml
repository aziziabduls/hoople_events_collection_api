docs: |-
  ## Booking List

  "Pesanan Saya" — variasi confirmed/completed/cancelled.

  **GET** `/bookings`

  - Response: `dto/bookings/booking-list.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

