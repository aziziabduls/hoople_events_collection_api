info:
  name: Booking Cancel
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/bookings/{id}/cancel"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "reason": "Ada agenda mendadak",
        "requestRefund": true
      }

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Pesanan berhasil dibatalkan",
            "data": {
              "id": "b0071e5c-1111-4d2e-8a3f-000000000301",
              "orderId": "ORD-20260314-0001",
              "status": "cancelled",
              "paymentStatus": "refunded",
              "cancelledAt": "2026-03-15T08:12:00+07:00",
              "cancellationReason": "Ada agenda mendadak",
              "refund": {
                "total": {
                  "amount": 251520,
                  "currency": "IDR"
                },
                "estimatedArrival": "2026-03-19T23:59:00+07:00",
                "destination": "BCA ****7890"
              }
            },
            "meta": null
          }

docs: |-
  ## Booking Cancel

  Batalkan + info refund.

  **POST** `/bookings/{id}/cancel`

  - Request: `dto/bookings/booking-cancel.request.json`
  - Response: `dto/bookings/booking-cancel.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
