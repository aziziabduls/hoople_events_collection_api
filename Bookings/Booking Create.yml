docs: |-
  ## Booking Create

  Buat pesanan dari checkout. Response awal berstatus `pending`.

  **POST** `/bookings`

  - Request: `dto/bookings/booking-create.request.json`
  - Response: `dto/bookings/booking-create.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

