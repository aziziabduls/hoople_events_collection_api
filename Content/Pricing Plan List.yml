info:
  name: Pricing Plan List
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/pricing-plans"
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
