docs: |-
  ## Pricing Plan List

  Paket Starter/Pro/Enterprise.

  **GET** `/pricing-plans`

  - Response: `dto/content/pricing-plan-list.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
