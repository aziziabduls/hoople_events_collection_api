info:
  name: Help Topic List
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/help/topics"
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Pusat bantuan berhasil dimuat",
            "data": [
              {
                "id": "help-booking",
                "slug": "pemesanan",
                "title": "Pemesanan & Tiket",
                "iconKey": "ticket",
                "faqs": [
                  {
                    "id": "faq-0001",
                    "question": "Bagaimana cara memesan tiket?",
                    "answer": "Pilih experience, tentukan sesi atau jenis tiket, isi data peserta, lalu selesaikan pembayaran. E-tiket langsung muncul di menu Pesanan Saya."
                  },
                  {
                    "id": "faq-0002",
                    "question": "Apakah saya bisa membatalkan pesanan?",
                    "answer": "Bisa, selama masih dalam masa pembatalan yang ditetapkan penyelenggara. Buka detail pesanan lalu pilih Batalkan."
                  }
                ]
              },
              {
                "id": "help-payment",
                "slug": "pembayaran",
                "title": "Pembayaran & Refund",
                "iconKey": "wallet",
                "faqs": [
                  {
                    "id": "faq-0003",
                    "question": "Metode pembayaran apa saja yang tersedia?",
                    "answer": "Virtual account BCA dan Mandiri, e-wallet GoPay dan OVO, serta QRIS."
                  },
                  {
                    "id": "faq-0004",
                    "question": "Berapa lama dana refund kembali?",
                    "answer": "Maksimal 5 hari kerja setelah pembatalan disetujui."
                  }
                ]
              },
              {
                "id": "help-organizer",
                "slug": "penyelenggara",
                "title": "Untuk Penyelenggara",
                "iconKey": "organizer",
                "faqs": [
                  {
                    "id": "faq-0005",
                    "question": "Berapa biaya platform Hoople?",
                    "answer": "Mulai 1,5% hingga 5% per transaksi, tergantung paket yang Anda pakai."
                  },
                  {
                    "id": "faq-0006",
                    "question": "Kapan dana saya dicairkan?",
                    "answer": "Pencairan otomatis setiap Jumat untuk transaksi yang sudah selesai."
                  }
                ]
              }
            ],
            "meta": null
          }

docs: |-
  ## Help Topic List

  Pusat bantuan, FAQ per topik.

  **GET** `/help/topics`

  - Response: `dto/content/help-topic-list.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
