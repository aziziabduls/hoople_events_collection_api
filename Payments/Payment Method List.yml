docs: |-
  ## Payment Method List

  VA, e-wallet, QRIS, kartu + biaya masing-masing.

  **GET** `/payment-methods`

  - Response: `dto/payments/payment-method-list.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
