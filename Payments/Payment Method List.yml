info:
  name: Payment Method List
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/payment-methods"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
