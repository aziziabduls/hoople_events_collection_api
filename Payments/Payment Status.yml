info:
  name: Payment Status
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/payments/{paymentId}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Status pembayaran berhasil diambil",
            "data": {
              "paymentId": "pay-9f8e7d6c-1111-4222-8333-000000000701",
              "bookingId": "b0071e5c-1111-4d2e-8a3f-000000000301",
              "status": "paid",
              "amount": {
                "amount": 251520,
                "currency": "IDR"
              },
              "expiresAt": null,
              "paidAt": "2026-03-14T09:41:00+07:00",
              "reference": "TRX-BCA-260314-77120",
              "failureReason": null
            },
            "meta": null
          }

docs: |-
  ## Payment Status

  Polling status bayar.

  **GET** `/payments/{paymentId}`

  - Response: `dto/payments/payment-status.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
