info:
  name: Payment Charge
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/payments/charge"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "bookingId": "b0071e5c-1111-4d2e-8a3f-000000000301",
        "paymentMethodId": "pm-bca-va"
      }

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Instruksi pembayaran berhasil dibuat",
            "data": {
              "paymentId": "pay-9f8e7d6c-1111-4222-8333-000000000701",
              "bookingId": "b0071e5c-1111-4d2e-8a3f-000000000301",
              "status": "pending",
              "methodId": "pm-bca-va",
              "methodName": "BCA Virtual Account",
              "amount": {
                "amount": 251520,
                "currency": "IDR"
              },
              "virtualAccountNumber": "8277 0812 3456 7890",
              "qrString": null,
              "deeplinkUrl": null,
              "expiresAt": "2026-03-14T10:30:00+07:00",
              "instructions": [
                {
                  "channel": "ATM BCA",
                  "steps": [
                    "Masukkan kartu dan PIN",
                    "Pilih Transaksi Lainnya > Transfer > ke BCA Virtual Account",
                    "Masukkan nomor 8277 0812 3456 7890",
                    "Konfirmasi jumlah Rp 251.520"
                  ]
                },
                {
                  "channel": "m-BCA",
                  "steps": [
                    "Buka m-BCA > m-Transfer > BCA Virtual Account",
                    "Masukkan nomor 8277 0812 3456 7890",
                    "Konfirmasi dan masukkan PIN"
                  ]
                }
              ]
            },
            "meta": null
          }

docs: |-
  ## Payment Charge

  Terbitkan instruksi bayar (nomor VA, QR, deeplink).

  **POST** `/payments/charge`

  - Request: `dto/payments/payment-charge.request.json`
  - Response: `dto/payments/payment-charge.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
