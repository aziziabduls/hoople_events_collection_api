info:
  name: Login via OTP
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/otp/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "purpose": "otp_login",
        "channel": "email",
        "destination": "aziziabdul95@gmail.com"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("envelope lengkap", function () {
          const body = res.getBody();
          expect(res.getStatus()).to.be.below(400);
          expect(body).to.have.property("success", true);
          expect(body).to.have.property("message");
          expect(body).to.have.property("data");
          expect(body).to.have.property("meta");
        });
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Kode verifikasi dikirim",
            "data": {
              "purpose": "phone_verification",
              "channel": "whatsapp",
              "sentTo": "+62 813 **** 2200",
              "codeLength": 6,
              "expiresAt": "2026-03-14T09:40:00+07:00",
              "resendAvailableAt": "2026-03-14T09:31:00+07:00",
              "attemptsAllowed": 5
            },
            "meta": null
          }
  - name: Terlalu sering
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Terlalu banyak permintaan kode. Coba lagi nanti.",
            "data": null,
            "meta": null,
            "error": {
              "code": "OTP_RATE_LIMITED",
              "errors": null,
              "retryAfterSeconds": 47
            }
          }
  - name: Sudah terverifikasi
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Email ini sudah terverifikasi",
            "data": null,
            "meta": null,
            "error": {
              "code": "ALREADY_VERIFIED",
              "errors": null
            }
          }

docs: |-
  # Login via OTP

  Kirim (atau kirim ulang) kode ke `destination`. Tanpa token - akunnya belum ada.

  |  |  |
  | --- | --- |
  | **Method** | `POST` |
  | **Path** | `/auth/otp/login` |
  | **Auth** | Tidak perlu token |
  | **Sukses** | `200 OK` |
  | **Sumber** |  |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `purpose` | string | ya | enum `otpPurpose`: `otp_login` |
  | `channel` | string | ya | enum `otpChannel`: `email` |
  | `destination` | string | ya |  |

  > Kolom **Wajib** diturunkan dari contoh: field yang bernilai `null` dianggap opsional. Aturan validasi sesungguhnya ditentukan backend.

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```
