info:
  name: Password Reset
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/auth/password/reset"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJkZXN0aW5hdGlvbiI6ImF6aXppYWJkdWw5NUBnbWFpbC5jb20iLCJwdXJwb3NlIjoicGFzc3dvcmRfcmVzZXQiLCJjaGFubmVsIjoiZW1haWwiLCJpYXQiOjE3ODk3MjM1NDgsImV4cCI6MTc4OTcyNDQ0OH0.viiyxfLZMKJDmEgygKdl4PqSt1G7Gv9QgeYl0jnrse8",
