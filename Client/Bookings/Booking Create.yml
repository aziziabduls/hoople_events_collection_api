docs: |-
  # Booking Create

  Buat pesanan dari checkout. Response awal berstatus `pending`.

  | | |
  | --- | --- |
  | **Method** | `POST` |
  | **Path** | `/bookings` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `201 Created` |
  | **Sumber** | `dto/participant/bookings/booking-create.request.json`<br>`dto/participant/bookings/booking-create.response.json` |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `experienceId` | string | ya | UUID v4 |
  | `kind` | string | ya | enum `experienceKind`: `event`, `activity` |
  | `sessionId` | string | ya | UUID v4 |
  | `ticketTypeId` | — | tidak | selalu `null` di contoh — tipe ditentukan backend |
  | `quantity` | integer | ya |  |
  | `buyer` | object | ya |  |
  | `buyer.fullName` | string | ya |  |
  | `buyer.email` | string | ya | email |
  | `buyer.phone` | string | ya |  |
  | `buyerIsParticipant` | boolean | ya |  |
  | `participants` | object[] | ya |  |
  | `participants[].fullName` | string | ya |  |
  | `participants[].email` | string | ya | email |
  | `participants[].phone` | string | ya |  |
  | `paymentMethodId` | string | ya |  |
  | `promoCode` | — | tidak | selalu `null` di contoh — tipe ditentukan backend |
  | `consent` | object | ya |  |
  | `consent.media` | boolean | ya |  |
  | `consent.terms` | boolean | ya |  |
  | `notes` | string[] | tidak | boleh `null` |


  > Kolom **Wajib** diturunkan dari contoh: field yang bernilai `null`
  > dianggap opsional. Aturan validasi sesungguhnya ditentukan backend.

  ## Response `201`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": null }
  ```

  Isi `data`:

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `id` | string | tidak | UUID v4 |
  | `orderId` | string | tidak |  |
  | `ticketId` | string | tidak |  |
  | `status` | string | tidak | enum `bookingStatus`: `pending`, `confirmed`, `completed`, `cancelled`, `refunded` |
  | `paymentStatus` | string | tidak | enum `paymentStatus`: `pending`, `paid`, `failed`, `refunded`, `covered` |
  | `kind` | string | tidak | enum `experienceKind`: `event`, `activity` |
  | `experience` | object | tidak |  |
  | `experience.id` | string | tidak | UUID v4 |
  | `experience.slug` | string | tidak |  |
  | `experience.title` | string | tidak |  |
  | `experience.host` | object | tidak |  |
  | `experience.host.id` | string | tidak | UUID v4 |
  | `experience.host.name` | string | tidak |  |
  | `experience.host.slug` | string | tidak |  |
  | `experience.coverImageUrl` | string | tidak | URL |
  | `session` | object | tidak |  |
  | `session.id` | string | tidak | UUID v4 |
  | `session.name` | string | tidak |  |
  | `session.startsAt` | string | tidak | ISO 8601 `+07:00` |
  | `session.endsAt` | string | tidak | ISO 8601 `+07:00` |
  | `session.coach` | string | tidak |  |
  | `session.room` | string | tidak |  |
  | `ticketType` | object | ya | boleh `null` |
  | `venue` | object | tidak |  |
  | `venue.name` | string | tidak |  |
  | `venue.area` | string | tidak |  |
  | `venue.city` | string | tidak |  |
  | `venue.address` | string | tidak |  |
  | `venue.latitude` | number | tidak |  |
  | `venue.longitude` | number | tidak |  |
  | `quantity` | integer | tidak |  |
  | `participants` | object[] | tidak |  |
  | `participants[].fullName` | string | tidak |  |
  | `participants[].email` | string | tidak | email |
  | `participants[].phone` | string | tidak |  |
  | `participants[].checkedInAt` | string | ya | boleh `null` |
  | `buyer` | object | tidak |  |
  | `buyer.fullName` | string | tidak |  |
  | `buyer.email` | string | tidak | email |
  | `buyer.phone` | string | tidak |  |
  | `priceBreakdown` | object | tidak |  |
  | `priceBreakdown.unitPrice` | money | tidak | `{ amount: integer, currency: "IDR" }` |
  | `priceBreakdown.quantity` | integer | tidak |  |
  | `priceBreakdown.subtotal` | money | tidak | `{ amount: integer, currency: "IDR" }` |
  | `priceBreakdown.discount` | money | tidak | `{ amount: integer, currency: "IDR" }` |
  | `priceBreakdown.platformFee` | money | tidak | `{ amount: integer, currency: "IDR" }` |
  | `priceBreakdown.gatewayFee` | money | tidak | `{ amount: integer, currency: "IDR" }` |
  | `priceBreakdown.total` | money | tidak | `{ amount: integer, currency: "IDR" }` |
  | `priceBreakdown.currency` | string | tidak |  |
  | `payment` | object | tidak |  |
  | `payment.methodId` | string | tidak |  |
  | `payment.methodName` | string | tidak |  |
  | `payment.virtualAccountNumber` | string | tidak |  |
  | `payment.paidAt` | string | ya | boleh `null` |
  | `payment.expiresAt` | string | tidak | ISO 8601 `+07:00` |
  | `payment.reference` | string | ya | boleh `null` |
  | `qrCodeUrl` | string | ya | boleh `null` |
  | `createdAt` | string | tidak | ISO 8601 `+07:00` |
  | `cancelledAt` | string | ya | boleh `null` |
  | `cancellationReason` | string | ya | boleh `null` |

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `422` | `shared/common/error-validation.response.json` | Validasi gagal; pesan per field ada di `error.errors`. |
  | `409` | `participant/bookings/booking-slot-unavailable.response.json` | Slot habis saat pemesanan diselesaikan. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.

  Selengkapnya di `dto/README.md`.

