docs: |-
  # Event Trending This Week

  Rail event "Trending this week".

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/events/trending-this-week` |
  | **Auth** | Tidak perlu (publik) |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/participant/catalog/event-trending-this-week.response.json` |

  ## Request body

  Tidak ada.

  ## Response `200`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": { … } }
  ```

  `data` berisi event yang sedang ramai minggu ini.

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `id` | string | tidak | UUID v4 |
  | `slug` | string | tidak | slug publik |
  | `title` | string | tidak | judul event |
  | `badge` | string | ya | mis. `trending`, `featured` |
  | `registeredCount` | integer | tidak | jumlah pendaftar |

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Enum** lowercase.

