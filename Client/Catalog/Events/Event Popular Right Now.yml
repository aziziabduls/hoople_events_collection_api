info:
  name: Event Popular Right Now
  type: http
  seq: 19

http:
  method: GET
  url: "{{baseUrl}}/events/popular-right-now"
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

docs: |-
  # Event Popular Right Now

  Rail event "Popular right now".

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/events/popular-right-now` |
  | **Auth** | Tidak perlu (publik) |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/participant/catalog/event-popular-right-now.response.json` |

  ## Request body

  Tidak ada.

  ## Response `200`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": { … } }
  ```

  `data` berisi event populer saat ini.

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `id` | string | tidak | UUID v4 |
  | `slug` | string | tidak | slug publik |
  | `title` | string | tidak | judul event |
  | `isFree` | boolean | tidak | gratis/berbayar |
  | `capacity` | integer | tidak | kapasitas event |
  | `registeredCount` | integer | tidak | total pendaftar |
  | `soldOut` | boolean | tidak | status kuota |

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount, currency }`.
  - **Enum** lowercase.

