docs: |-
  # Event Detail

  Detail + jenis tiket + rundown.

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/events/{slug}` |
  | **Auth** | Tidak perlu (publik) |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/participant/catalog/event-detail.response.json` |

  ## Path parameter

  | Nama | Catatan |
  | --- | --- |
  | `{slug}` | Slug publik, mis. `morning-yoga-flow`. |

  ## Request body

  Tidak ada.

  ## Response `200`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": null }
  ```

  Isi `data`:

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `id` | string | tidak | UUID v4 |
  | `slug` | string | tidak |  |
  | `title` | string | tidak |  |
  | `kind` | string | tidak | enum `experienceKind`: `event`, `activity` |
  | `host` | object | tidak |  |
  | `host.id` | string | tidak | UUID v4 |
  | `host.name` | string | tidak |  |
  | `host.slug` | string | tidak |  |
  | `host.avatarUrl` | string | tidak | URL |
  | `host.verified` | boolean | tidak |  |
  | `host.rating` | number | tidak |  |
  | `host.experienceCount` | integer | tidak |  |
  | `host.bio` | string | tidak |  |
  | `category` | string | tidak |  |
  | `badge` | string | tidak |  |
  | `status` | string | tidak | enum `experienceStatus`: `draft`, `published`, `ongoing`, `completed`, `cancelled` |
  | `summary` | string | tidak |  |
  | `coverImageUrl` | string | tidak | URL |
  | `startsAt` | string | tidak | ISO 8601 `+07:00` |
  | `endsAt` | string | tidak | ISO 8601 `+07:00` |
  | `price` | money | tidak | `{ amount: integer, currency: "IDR" }` |
  | `isFree` | boolean | tidak |  |
  | `soldOut` | boolean | tidak |  |
  | `capacity` | integer | tidak |  |
  | `registeredCount` | integer | tidak |  |
  | `venue` | object | tidak |  |
  | `venue.name` | string | tidak |  |
  | `venue.area` | string | tidak |  |
  | `venue.city` | string | tidak |  |
  | `venue.address` | string | tidak |  |
  | `venue.latitude` | number | tidak |  |
  | `venue.longitude` | number | tidak |  |
  | `venue.notes` | string[] | tidak |  |
  | `isSaved` | boolean | tidak |  |
  | `description` | string | tidak |  |
  | `doorsOpenAt` | string | tidak | ISO 8601 `+07:00` |
  | `ticketTypes` | object[] | tidak |  |
  | `ticketTypes[].id` | string | tidak | UUID v4 |
  | `ticketTypes[].name` | string | tidak |  |
  | `ticketTypes[].description` | string | tidak |  |
  | `ticketTypes[].price` | money | tidak | `{ amount: integer, currency: "IDR" }` |
  | `ticketTypes[].quota` | integer | tidak |  |
  | `ticketTypes[].sold` | integer | tidak |  |
  | `ticketTypes[].soldOut` | boolean | tidak |  |
  | `ticketTypes[].salesEndAt` | string | tidak | ISO 8601 `+07:00` |
  | `rundown` | object[] | tidak |  |
  | `rundown[].time` | string | tidak |  |
  | `rundown[].label` | string | tidak |  |
  | `faqs` | object[] | tidak |  |
  | `faqs[].question` | string | tidak |  |
  | `faqs[].answer` | string | tidak |  |
  | `lineup` | object[] | tidak |  |
  | `lineup[].name` | string | tidak |  |
  | `lineup[].role` | string | tidak | enum `role`: `participant`, `organizer`, `teams_admin` |
  | `lineup[].avatarUrl` | string | ya | boleh `null` |
  | `policy` | object | tidak |  |
  | `policy.cancellation` | string | tidak |  |
  | `policy.ageRestriction` | — | ya | selalu `null` di contoh — tipe ditentukan backend |
  | `policy.photography` | string | tidak |  |

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `404` | `shared/common/error-not-found.response.json` | Id atau slug tidak ditemukan. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.

  Selengkapnya di `dto/README.md`.
