docs: |-
  # Home Recommended For You

  Rail beranda "Recommended for you".

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/home/recommended-for-you` |
  | **Auth** | Tidak perlu (publik) |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/participant/catalog/home-recommended-for-you.response.json` |

  ## Request body

  Tidak ada.

  ## Response `200`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": { … } }
  ```

  Isi `data` adalah array card pengalaman campuran (`activity` / `event`).

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `id` | string | tidak | UUID v4 |
  | `slug` | string | tidak | slug publik |
  | `title` | string | tidak | judul pengalaman |
  | `kind` | string | tidak | enum `experienceKind`: `activity`, `event` |
  | `host` | object | tidak | `{ id, name, slug }` |
  | `category` | string | tidak | kategori tampilan |
  | `summary` | string | tidak | ringkasan singkat |
  | `coverImageUrl` | string | tidak | URL gambar |
  | `isSaved` | boolean | tidak | status simpan user |
  | `soldOut` | boolean | tidak | ketersediaan slot/tiket |

  `meta` memakai pagination standar (`page`, `perPage`, `total`, `totalPages`).

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount, currency }`.
  - **Instant** (`startsAt`, `endsAt`, `nextSessionAt`) ISO 8601 `+07:00`.
  - **Enum** lowercase.
  - **Field nullable** tetap dikirim `null`, jangan dihilangkan.

