info:
  name: Home Trending This Week
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/home/trending-this-week"
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

docs: |-
  # Home Trending This Week

  Rail beranda "Trending this week".

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/home/trending-this-week` |
  | **Auth** | Tidak perlu (publik) |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/participant/catalog/home-trending-this-week.response.json` |

  ## Request body

  Tidak ada.

  ## Response `200`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": { … } }
  ```

  Isi `data` adalah array card pengalaman yang sedang naik minggu ini.

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `id` | string | tidak | UUID v4 |
  | `slug` | string | tidak | slug publik |
  | `title` | string | tidak | judul pengalaman |
  | `kind` | string | tidak | `activity` / `event` |
  | `badge` | string | ya | mis. `trending`, `featured` |
  | `isFree` | boolean | tidak | gratis atau berbayar |
  | `venue` | object | tidak | lokasi ringkas |

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Enum** lowercase.
  - **Field nullable** tetap dikirim `null`, jangan dihilangkan.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
