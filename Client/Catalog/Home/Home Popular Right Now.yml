info:
  name: Home Popular Right Now
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/home/popular-right-now"
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

docs: |-
  # Home Popular Right Now

  Rail beranda "Popular right now".

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/home/popular-right-now` |
  | **Auth** | Tidak perlu (publik) |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/participant/catalog/home-popular-right-now.response.json` |

  ## Request body

  Tidak ada.

  ## Response `200`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": { … } }
  ```

  Isi `data` adalah array card pengalaman paling populer saat ini.

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `id` | string | tidak | UUID v4 |
  | `slug` | string | tidak | slug publik |
  | `title` | string | tidak | judul pengalaman |
  | `kind` | string | tidak | `activity` / `event` |
  | `host` | object | tidak | `{ id, name, slug }` |
  | `priceFrom` / `price` | object | tidak | objek uang `{ amount, currency }` |
  | `isSaved` | boolean | tidak | status simpan user |

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount, currency }`.
  - **Enum** lowercase.

settings:
