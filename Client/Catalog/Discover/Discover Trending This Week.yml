docs: |-
  # Discover Trending This Week

  Rail halaman discover "Trending this week".

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/discover/trending-this-week` |
  | **Auth** | Tidak perlu (publik) |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/participant/catalog/discover-trending-this-week.response.json` |

  ## Request body

  Tidak ada.

  ## Response `200`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": { … } }
  ```

  `data` berisi pengalaman yang naik minggu ini di halaman discover.

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `id` | string | tidak | UUID v4 |
  | `slug` | string | tidak | slug publik |
  | `title` | string | tidak | judul pengalaman |
  | `kind` | string | tidak | `activity` / `event` |
  | `badge` | string | ya | bisa `null` |

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Enum** lowercase.

