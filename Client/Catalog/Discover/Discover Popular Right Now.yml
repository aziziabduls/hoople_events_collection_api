info:
  name: Discover Popular Right Now
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/discover/popular-right-now"
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

docs: |-
  # Discover Popular Right Now

  Rail halaman discover "Popular right now".

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/discover/popular-right-now` |
  | **Auth** | Tidak perlu (publik) |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/participant/catalog/discover-popular-right-now.response.json` |

  ## Request body

  Tidak ada.

  ## Response `200`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": { … } }
  ```

  `data` berisi pengalaman yang paling populer saat ini di halaman discover.

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `id` | string | tidak | UUID v4 |
  | `slug` | string | tidak | slug publik |
  | `title` | string | tidak | judul pengalaman |
  | `kind` | string | tidak | `activity` / `event` |
  | `isFree` | boolean | tidak | gratis atau berbayar |
  | `soldOut` | boolean | tidak | status ketersediaan |

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount, currency }`.
  - **Enum** lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
