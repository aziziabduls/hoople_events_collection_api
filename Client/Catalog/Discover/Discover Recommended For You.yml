info:
  name: Discover Recommended For You
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/discover/recommended-for-you"
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

docs: |-
  # Discover Recommended For You

  Rail halaman discover "Recommended for you".

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/discover/recommended-for-you` |
  | **Auth** | Tidak perlu (publik) |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/participant/catalog/discover-recommended-for-you.response.json` |

  ## Request body

  Tidak ada.

  ## Response `200`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": { … } }
  ```

  `data` berisi array card pengalaman untuk rail discover.

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `id` | string | tidak | UUID v4 |
  | `slug` | string | tidak | slug publik |
  | `title` | string | tidak | judul pengalaman |
  | `kind` | string | tidak | `activity` / `event` |
  | `category` | string | tidak | kategori tampilan |
  | `summary` | string | tidak | ringkasan singkat |

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount, currency }`.
  - **Enum** lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
