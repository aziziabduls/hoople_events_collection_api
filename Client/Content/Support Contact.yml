http:
  method: POST
  url: "{{baseUrl}}/support/tickets"
  auth: none
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fullName": "Adriani Ajeng",
        "email": "adriani.ajeng@gmail.com",
        "topic": "pembayaran",
        "orderId": "ORD-20260314-0001",
        "message": "Pembayaran saya sudah terpotong tapi status pesanan masih pending."
      }

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Pesan Anda telah dikirim",
            "data": {
              "ticketId": "SUP-20260314-0042",
              "status": "open",
              "estimatedResponseAt": "2026-03-15T09:30:00+07:00",
              "createdAt": "2026-03-14T09:30:00+07:00"
            },
            "meta": null
          }

docs: |-
  # Support Contact

  Form hubungi kami.

  | | |
  | --- | --- |
  | **Method** | `POST` |
  | **Path** | `/support/tickets` |
  | **Auth** | Tidak perlu (publik) |
  | **Sukses** | `201 Created` |
  | **Sumber** | `dto/participant/content/support-contact.request.json`<br>`dto/participant/content/support-contact.response.json` |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `fullName` | string | ya |  |
  | `email` | string | ya | email |
  | `topic` | string | ya |  |
  | `orderId` | string | ya |  |
  | `message` | string | ya |  |


  > Kolom **Wajib** diturunkan dari contoh: field yang bernilai `null`
  > dianggap opsional. Aturan validasi sesungguhnya ditentukan backend.

  ## Response `201`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": null }
  ```

  Isi `data`:

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `ticketId` | string | tidak |  |
  | `status` | string | tidak | enum `supportTicketStatus`: `open`, `in_progress`, `resolved`, `closed` |
  | `estimatedResponseAt` | string | tidak | ISO 8601 `+07:00` |
  | `createdAt` | string | tidak | ISO 8601 `+07:00` |

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `422` | `shared/common/error-validation.response.json` | Validasi gagal; pesan per field ada di `error.errors`. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.

  Selengkapnya di `dto/README.md`.

