info:
  name: Payment Webhook
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/payments/webhook"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "orderId": "HQU12610140001",
        "status": "SUCCESS",
        "paymentMethod": "QRIS",
        "platform": "HEV",
        "gateway": {
          "transaction_id": "41e239ae-dcbf-4acf-b614-9744c551cede",
          "transaction_status": "SUCCESS",
          "orderId": "HQU12610140001",
          "payment_status": "PAID",
          "payment_time": "20261014134511000",
          "issuer": "Monei"
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Payment Webhook

  Callback dari payment gateway ke backend.

  | | |
  | --- | --- |
  | **Method** | `POST` |
  | **Path** | `/webhooks/payment` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/participant/payments/payment-webhook.request.json` |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `eventType` | string | ya |  |
  | `deliveryId` | string | ya |  |
  | `occurredAt` | string | ya | ISO 8601 `+07:00` |
  | `data` | object | ya |  |
  | `data.paymentId` | string | ya |  |
  | `data.bookingId` | string | ya | UUID v4 |
  | `data.status` | string | ya | enum `bookingTimelineStatus`: `created`, `paid`, `confirmed`, `cancelled`, `refunded` |
  | `data.amount` | integer | ya |  |
  | `data.currency` | string | ya |  |
  | `data.reference` | string | ya |  |
  | `signature` | string | ya |  |


  > Kolom **Wajib** diturunkan dari contoh: field yang bernilai `null`
  > dianggap opsional. Aturan validasi sesungguhnya ditentukan backend.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `422` | `shared/common/error-validation.response.json` | Validasi gagal; pesan per field ada di `error.errors`. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.

  Selengkapnya di `dto/README.md`.
