info:
  name: Upload
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/media/upload"
  auth: inherit
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: []
      - name: purpose
        type: text
        value: cover

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Gambar berhasil diunggah",
            "data": {
              "url": "https://cdn.hoople.id/uploads/2026/03/cover-8f2a1c9d4b.jpg"
            },
            "meta": null
          }

docs: |-
  # Upload

  Unggah gambar (cover, galeri, logo, avatar). Mengembalikan `url` yang dipakai payload builder.

  | | |
  | --- | --- |
  | **Method** | `POST` |
  | **Path** | `/media/upload` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/shared/media/upload.response.json` |

  ## Request body

  `multipart/form-data` — **bukan JSON**.

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `file` | file | ya | Berkas gambar. JPG/PNG/WebP. |
  | `purpose` | string | tidak | `cover` \| `gallery` \| `logo` \| `avatar` — menentukan batas ukuran dan rasio. |

  Response mengembalikan `data.url`; URL itulah yang dikirim sebagai
  `coverImageUrl` / `gallery[]` saat submit builder, sehingga submit tetap JSON murni.

  ## Response `200`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": null }
  ```

  Isi `data`:

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `url` | string | tidak | URL |

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.

  Selengkapnya di `dto/README.md`.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
