info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  auth: none
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "adriani.ajeng@gmail.com",
        "password": "RahasiaKu123",
        "rememberMe": true
      }

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Berhasil masuk",
            "data": {
              "user": {
                "id": "3f8a1c22-9d41-4b7e-8f0a-11c2d3e4f501",
                "fullName": "Adriani Ajeng",
                "email": "adriani.ajeng@gmail.com",
                "phone": "+62 812 3456 7890",
                "avatarUrl": null,
                "roles": [
                  "participant",
                  "organizer"
                ],
                "emailVerifiedAt": "2026-03-14T09:41:00+07:00",
                "createdAt": "2026-03-14T09:30:00+07:00"
              },
              "tokenType": "Bearer",
              "accessToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock-access-token",
              "refreshToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock-refresh-token",
              "expiresIn": 3600,
              "expiresAt": "2026-03-14T10:30:00+07:00"
            },
            "meta": null
          }

docs: |-
  ## Login

  Masuk, mengembalikan token.

  **POST** `/auth/login`

  - Request: `dto/auth/login.request.json`
  - Response: `dto/auth/login.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
