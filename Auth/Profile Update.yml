http:
  method: PATCH
  url: "{{baseUrl}}/auth/me"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fullName": "Adriani Ajeng",
        "phone": "+62 812 3456 7890",
        "city": "Jakarta Selatan",
        "avatarUrl": null,
        "interests": [
          "sports_fitness",
          "art_design",
          "food_drink"
        ],
        "notificationPreferences": {
          "email": true,
          "whatsapp": true,
          "push": false
        }
      }

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Profil berhasil diperbarui",
            "data": {
              "id": "3f8a1c22-9d41-4b7e-8f0a-11c2d3e4f501",
              "fullName": "Adriani Ajeng",
              "email": "adriani.ajeng@gmail.com",
              "phone": "+62 812 3456 7890",
              "avatarUrl": null,
              "roles": [
                "participant",
                "organizer"
              ],
              "emailVerifiedAt": null,
              "createdAt": "2026-03-14T09:30:00+07:00",
              "city": "Jakarta Selatan"
            },
            "meta": null
          }

docs: |-
  # Profile Update

  Ubah profil & preferensi notifikasi.

  | | |
  | --- | --- |
  | **Method** | `PATCH` |
  | **Path** | `/auth/me` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/auth/profile-update.request.json`<br>`dto/auth/profile-update.response.json` |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `fullName` | string | ya |  |
  | `phone` | string | ya |  |
  | `city` | string | ya |  |
  | `avatarUrl` | string | tidak | boleh `null` |
  | `interests` | string[] | ya |  |
  | `notificationPreferences` | object | ya |  |
  | `notificationPreferences.email` | boolean | ya |  |
  | `notificationPreferences.whatsapp` | boolean | ya |  |
  | `notificationPreferences.push` | boolean | ya |  |


  > Kolom **Wajib** diturunkan dari contoh: field yang bernilai `null`
  > dianggap opsional. Aturan validasi sesungguhnya ditentukan backend.

  ## Response `200`

  Envelope standar:

  ```json
  { "success": true, "message": "…", "data": …, "meta": null }
  ```

  Isi `data`:

  | Field | Tipe | Nullable | Catatan |
  | --- | --- | --- | --- |
  | `id` | string | tidak | UUID v4 |
  | `fullName` | string | tidak |  |
  | `email` | string | tidak | email |
  | `phone` | string | tidak |  |
  | `avatarUrl` | string | ya | boleh `null` |
  | `roles` | string[] | tidak | enum `role`: `participant`, `organizer`, `teams_admin` |
  | `emailVerifiedAt` | string | ya | boleh `null` |
  | `createdAt` | string | tidak | ISO 8601 `+07:00` |
  | `city` | string | tidak |  |

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `422` | `common/error-validation.response.json` | Validasi gagal; pesan per field ada di `error.errors`. |
  | `500` | `common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.

  Selengkapnya di `dto/README.md`.

