info:
  name: Profile Update
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/auth/me"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fullName": "Adriani Ajeng",
        "phone": "+62 812 3456 7890",
        "city": "Jakarta Selatan",
        "avatarUrl": null,
        "interests": [
          "sports_fitness",
          "art_design",
          "food_drink"
        ],
        "notificationPreferences": {
          "email": true,
          "whatsapp": true,
          "push": false
        }
      }

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Profil berhasil diperbarui",
            "data": {
              "id": "3f8a1c22-9d41-4b7e-8f0a-11c2d3e4f501",
              "fullName": "Adriani Ajeng",
              "email": "adriani.ajeng@gmail.com",
              "phone": "+62 812 3456 7890",
              "avatarUrl": null,
              "roles": [
                "participant",
                "organizer"
              ],
              "emailVerifiedAt": null,
              "createdAt": "2026-03-14T09:30:00+07:00",
              "city": "Jakarta Selatan"
            },
            "meta": null
          }

docs: |-
  ## Profile Update

  Ubah profil & preferensi notifikasi.

  **PATCH** `/auth/me`

  - Request: `dto/auth/profile-update.request.json`
  - Response: `dto/auth/profile-update.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
