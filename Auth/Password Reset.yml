info:
  name: Password Reset
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/auth/password/reset"
  auth: none
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "b7d1f0a9-2c34-4e56-8a90-abcdef123456",
        "password": "PasswordBaru123",
        "passwordConfirmation": "PasswordBaru123"
      }

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Password berhasil diubah",
            "data": null,
            "meta": null
          }

docs: |-
  ## Password Reset

  Set password baru.

  **POST** `/auth/password/reset`

  - Request: `dto/auth/password-reset.request.json`
  - Response: `dto/auth/password-reset.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
