info:
  name: Profile
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/auth/me"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Profil berhasil diambil",
            "data": {
              "id": "3f8a1c22-9d41-4b7e-8f0a-11c2d3e4f501",
              "fullName": "Adriani Ajeng",
              "email": "adriani.ajeng@gmail.com",
              "phone": "+62 812 3456 7890",
              "avatarUrl": null,
              "roles": [
                "participant",
                "organizer"
              ],
              "emailVerifiedAt": "2026-03-14T09:41:00+07:00",
              "createdAt": "2026-03-14T09:30:00+07:00",
              "interests": [
                "sports_fitness",
                "art_design"
              ],
              "city": "Jakarta Selatan",
              "stats": {
                "bookingsTotal": 12,
                "bookingsUpcoming": 2,
                "savedTotal": 7,
                "communitiesJoined": 3
              },
              "notificationPreferences": {
                "email": true,
                "whatsapp": true,
                "push": false
              }
            },
            "meta": null
          }

docs: |-
  ## Profile

  Profil + statistik ringkas.

  **GET** `/auth/me`

  - Response: `dto/auth/profile.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
