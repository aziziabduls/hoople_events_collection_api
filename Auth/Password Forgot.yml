info:
  name: Password Forgot
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/auth/password/forgot"
  auth: none
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "adriani.ajeng@gmail.com"
      }

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Tautan pemulihan telah dikirim ke email Anda",
            "data": {
              "sentTo": "adriani.ajeng@gmail.com",
              "expiresAt": "2026-03-14T10:30:00+07:00"
            },
            "meta": null
          }

docs: |-
  ## Password Forgot

  Kirim tautan reset.

  **POST** `/auth/password/forgot`

  - Request: `dto/auth/password-forgot.request.json`
  - Response: `dto/auth/password-forgot.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
