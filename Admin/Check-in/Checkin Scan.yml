info:
  name: Checkin Scan
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/org/check-in/scan"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "ticketCode": "HPL-8K2M-4QX7-1",
        "sessionId": "ses-0001-4aaa-8bbb-000000000001",
        "scannedAt": "2026-03-16T06:52:00+07:00"
      }

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"
  scripts:
    - type: tests
      code: |-
        test("envelope lengkap", function () {
          const body = res.getBody();
          expect(res.getStatus()).to.be.below(400);
          expect(body).to.have.property("success", true);
          expect(body).to.have.property("message");
          expect(body).to.have.property("data");
          expect(body).to.have.property("meta");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Sukses"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Check-in berhasil",
            "data": {
              "result": "accepted",
              "ticketCode": "HPL-8K2M-4QX7-1",
              "registrationId": "reg-0001-4aaa-8bbb-000000000001",
              "participant": {
                "name": "Adriani Ajeng",
                "email": "adriani.ajeng@gmail.com"
              },
              "experienceTitle": "Morning Yoga Flow",
              "sessionStartsAt": "2026-03-16T07:00:00+07:00",
              "checkedInAt": "2026-03-16T06:52:00+07:00",
              "sessionProgress": {
                "checkedIn": 18,
                "booked": 24,
                "capacity": 30
              }
            },
            "meta": null
          }
  - name: "Tiket sudah dipakai"
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Tiket ini sudah dipakai check-in",
            "data": {
              "result": "already_used",
              "ticketCode": "HPL-8K2M-4QX7-1",
              "checkedInAt": "2026-03-16T06:52:00+07:00"
            },
            "meta": null,
            "error": {
              "code": "TICKET_ALREADY_USED",
              "errors": null
            }
          }

docs: |
  # Checkin Scan

  Scan QR di pintu.

  | | |
  | --- | --- |
  | **Method** | `POST` |
  | **Path** | `/org/check-in/scan` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/organizer/checkin-scan.request.json`<br>`dto/organizer/checkin-scan.response.json`<br>`dto/organizer/checkin-scan-rejected.response.json` |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `ticketCode` | string | ya |  |
  | `sessionId` | string | ya |  |
  | `scannedAt` | string | ya | ISO 8601 `+07:00` |

  > Kolom **Wajib** diturunkan dari contoh: field yang bernilai `null`
  > dianggap opsional. Aturan validasi sesungguhnya ditentukan backend.

  ## Penolakan bukan kegagalan

  `scanResult` boleh bernilai `accepted`, `already_used`, `invalid`, `expired`
  atau `wrong_event`. Tiket yang sudah dipakai dijawab `409` dengan envelope error
  penuh — lihat contoh kedua — karena petugas pintu perlu tahu bedanya antara
  "gagal" dan "sudah masuk tadi".

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `403` | `shared/common/error-forbidden.response.json` | Akun tidak punya peran `organizer`. |
  | `409` | `organizer/checkin-scan-rejected.response.json` | Tiket sudah dipakai — lihat contoh kedua. |
  | `422` | `shared/common/error-validation.response.json` | Validasi gagal; pesan per field ada di `error.errors`. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.
  - **Paginasi** `page` / `perPage`, dan `meta` berisi `{ page, perPage, total, totalPages }`.

  Selengkapnya di `dto/README.md`.
