info:
  name: Admin
  seq: 2

# Every request inside Admin/ says `auth: inherit`, and this is what it inherits.
# Without a bearer defined here, `inherit` resolves to nothing and the whole
# folder silently sends unauthenticated requests.
auth:
  type: bearer
  token: "{{accessToken}}"

docs: |-
  # Admin — Hoople for Organizers

  Konsol penyelenggara: satu studio atau komunitas mengelola experience
  publiknya sendiri. Semua endpoint di bawah `Organizer/` berawalan
  `/organizer/` dan menuntut token yang `roles`-nya memuat `organizer`.

  Bagian ini diregenerasi dari `dto/` di repositori frontend
  `hoople-event-admin-dashboard`, jadi setiap body request dan setiap contoh
  response di sini **identik** dengan berkas JSON di sana. Kalau `dto/` berubah,
  bagian ini harus dibangkitkan ulang — jangan disunting sebelah tangan.

  ## Mulai dari mana

  1. Pilih environment: **Local Host**, **Local**, atau **Staging**.
  2. Jalankan **Auth → Login**. Script `after-response`-nya menyimpan
     `accessToken` dan `refreshToken` ke environment yang sedang aktif.
  3. Jalankan endpoint mana pun di **Organizer**. Semuanya `auth: inherit` dan
     mengambil bearer token dari folder ini — tidak ada yang perlu ditempel
     manual.
  4. Kalau token kedaluwarsa (`401`), jalankan **Auth → Refresh**; script yang
     sama menimpa token lama.

  ## Isi

  | Folder | Sumber | Isi |
  | --- | --- | --- |
  | `Auth/` | `dto/shared/auth/` | 8 endpoint — login, register, refresh, logout, profil, reset password |
  | `Organizer/` | `dto/organizer/` | 17 endpoint — dashboard, experience, sesi, registrasi, check-in, analitik, keuangan, pengaturan |
  | `Media/` | `dto/shared/media/` | 1 endpoint — unggah gambar (`multipart/form-data`) |

  `Auth/` dan `Media/` berasal dari `dto/shared/`, yang berarti **endpoint yang
  sama juga dipakai situs peserta** (lihat `Client/`). Kontraknya satu; kalau
  Anda mengubah salah satu sisi, ubah dua-duanya atau jangan ubah sama sekali.

  ## Variabel

  | Variabel | Dari mana | Untuk |
  | --- | --- | --- |
  | `baseUrl` | environment | Origin + prefix versi API |
  | `accessToken` | diisi otomatis oleh **Login** / **Refresh** | Bearer token |
  | `refreshToken` | diisi otomatis oleh **Login** / **Refresh** | Body **Refresh** |
  | `experienceId` | isi sendiri, ambil dari **Experience List** | Path param experience |
  | `sessionId` | isi sendiri, ambil dari **Session List** | Path param / query sesi |

  ## Envelope

  Setiap response memakai bentuk yang sama:

  ```json
  { "success": true, "message": "…", "data": { }, "meta": null }
  ```

  `meta` berisi paginasi (`page`, `perPage`, `total`, `totalPages`) pada endpoint
  daftar, dan `null` di endpoint lain. Response error memakai envelope yang sama
  ditambah blok `error`. Setiap request punya assertion untuk `res.status < 400`
  dan `res.body.success == true`, plus test yang memeriksa keempat kunci envelope
  benar-benar ada — termasuk `meta`, yang paling sering lupa dikirim.

  Rinciannya di `dto/README.md`.
