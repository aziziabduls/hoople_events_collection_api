docs: |
  # Auth

  Masuk dan kelola akun host.

  **Jalankan `Login` lebih dulu.** Script `after-response`-nya menyimpan
  `accessToken` ke environment aktif, dan seluruh folder Admin mewarisi token itu
  dari `Admin/folder.yml`.

  `Register Host` khusus konsol ini: yang didaftarkan adalah **akun host**, bukan
  akun peserta. Tidak ada minat, tidak ada langkah profil — nama komunitas,
  nomor WhatsApp, sandi, selesai. Sisanya (`Login`, `Refresh`, `Me`, `Logout`,
  reset sandi) adalah kontrak `dto/shared/auth/` yang sama dengan situs peserta.
