runtime:
  scripts:
    - type: tests
      code: |-
        test("envelope lengkap", function () {
          const body = res.getBody();
          expect(res.getStatus()).to.be.below(400);
          expect(body).to.have.property("success", true);
          expect(body).to.have.property("message");
          expect(body).to.have.property("data");
          expect(body).to.have.property("meta");
        });
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Password berhasil diubah",
            "data": null,
            "meta": null
          }

docs: |-
  # Password Reset

  Set password baru - dua mode, lihat "Dua mode, satu endpoint" di bawah.

  |  |  |
  | --- | --- |
  | **Method** | `POST` |
  | **Path** | `/auth/password/reset` |
  | **Auth** | Tanpa token - **verificationToken** dari OTP Verify (belum masuk) — **atau** `Authorization: Bearer <accessToken>` tanpa `verificationToken` (sudah masuk). Tidak pernah keduanya. |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/shared/auth/password-reset.request.json`<br/>`dto/shared/auth/password-reset.response.json` |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | currentPassword | string | ya |  |
  | newPassword | string | ya |  |
  | confirmPassword | string | ya |  |

  > Kolom **Wajib** diturunkan dari contoh: field yang bernilai `null` dianggap opsional. Aturan validasi sesungguhnya ditentukan backend.

  <br/>

  ```
  Response 

  { "success": true, "message": "Password changed successfully", "data": { "accessToken": "new_access_token", "refreshToken": "new_refresh_token" } }
  ```

  <br/>

  ## Dua mode, satu endpoint

  |  | Lupa password (belum masuk) | Ganti password (sudah masuk) |
  | --- | --- | --- |
  | Header `Authorization` | Tidak ada | `Bearer <accessToken>` |
  | Body | `{ verificationToken, password, passwordConfirmation }` | `{ password, passwordConfirmation }` |
  | Buktinya | `verificationToken` dari **OTP Verify** (`purpose: "password_reset"`) | Sesi yang sedang berjalan |

  Request ini diset `auth: none` di Bruno supaya alur lupa-password - yang lebih sering diuji duluan, karena itu yang sedang dibangun - bisa langsung jalan. Untuk menguji mode kedua secara manual: tambahkan header `Authorization`, hapus `verificationToken` dari body.

  ## Field `token` sudah dihapus

  Contoh lama membawa `"token": "b7d1f0a9-2c34-4e56-8a90-abcdef123456"` - sisa dari desain tautan-email yang sudah tidak dipakai (lihat **Password Forgot**). Tidak ada mode di atas yang memakainya lagi; jangan dikembalikan.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `403` | `shared/common/error-forbidden.response.json` | Akun tidak punya peran `organizer`. |
  | `422` | `shared/common/error-validation.response.json` | Validasi gagal; pesan per field ada di `error.errors`. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - `roles` adalah array — satu akun bisa `["participant", "organizer"]`.
  - **Paginasi** `page` / `perPage`, dan `meta` berisi `{ page, perPage, total, totalPages }`.

  Selengkapnya di `dto/README.md`.
