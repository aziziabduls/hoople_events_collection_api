info:
  name: Register Host
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/org/auth/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fullName": "Abdul Azizi",
        "email": "aziziabdul@icloud.com",
        "phone": "+6282299328390",
        "password": "RahasiaKu123",
        "passwordConfirmation": "RahasiaKu123",
        "interests": [],
        "acceptedTermsAt": "2026-03-14T09:30:00+07:00"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.success && body.data && body.data.accessToken) {
          bru.setEnvVar("accessToken", body.data.accessToken);
          if (body.data.refreshToken) bru.setEnvVar("refreshToken", body.data.refreshToken);
          console.log("accessToken disimpan ke environment aktif");
        }
    - type: tests
      code: |-
        test("envelope lengkap", function () {
          const body = res.getBody();
          expect(res.getStatus()).to.be.below(400);
          expect(body).to.have.property("success", true);
          expect(body).to.have.property("message");
          expect(body).to.have.property("data");
          expect(body).to.have.property("meta");
        });
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Sukses
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Registration successful",
            "data": {
              "user": {
                "id": "5f1a7c62-9d84-4e13-8b57-44a1c6e7b902",
                "fullName": "Kevin Nathanael",
                "email": "kevin@ruangtumbuh.id",
                "phone": "+62 813 8899 2200",
                "avatarUrl": null,
                "roles": [
                  "organizer"
                ],
                "emailVerifiedAt": null,
                "createdAt": "2026-03-14T09:30:00+07:00"
              },
              "tokenType": "Bearer",
              "accessToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock-access-token",
              "refreshToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock-refresh-token",
              "expiresIn": 3600,
              "expiresAt": "2026-03-14T10:30:00+07:00"
            },
            "meta": null
          }

docs: |
  # Register Host

  Buat akun host. Mendaftar juga membuat Anda masuk, jadi script after-response menyimpan tokennya sama seperti Login.

  | | |
  | --- | --- |
  | **Method** | `POST` |
  | **Path** | `/org/auth/register` |
  | **Auth** | Tidak perlu token |
  | **Sukses** | `201 Created` |
  | **Sumber** | `dto/organizer/register-host.request.json`<br>`dto/organizer/register-host.response.json` |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `fullName` | string | ya |  |
  | `email` | string | ya | email |
  | `phone` | string | ya |  |
  | `password` | string | ya |  |
  | `passwordConfirmation` | string | ya |  |
  | `interests` | array | ya |  |
  | `acceptedTermsAt` | string | ya | ISO 8601 `+07:00` |

  > Kolom **Wajib** diturunkan dari contoh: field yang bernilai `null`
  > dianggap opsional. Aturan validasi sesungguhnya ditentukan backend.

  ## Payload-nya sama dengan pendaftaran peserta - terbukti, bukan diasumsikan

  Draf dokumen ini semula mengira endpoint ini punya payload sendiri
  (`hostName`, `whatsappNumber`, `verificationToken`). Diuji langsung ke
  server: body kosong dibalas `422` yang menyebutkan field yang sebenarnya
  wajib - `fullName`, `email`, `phone`, `password`,
  `passwordConfirmation`, `interests` (array), `acceptedTermsAt`. Itu
  persis bentuk `/auth/register` peserta. Yang membedakan cuma jalurnya dan
  `roles` yang dikembalikan: mendaftar di sini memberi
  `roles: ["organizer"]`, bukan `["participant"]`.

  `fullName` bisa berarti nama komunitas atau nama orang - belum terbukti
  mana yang benar, karena backend menerima apa pun isinya tanpa membedakan.
  Konsol saat ini mengirim nama komunitas dari form pendaftaran. Kalau ternyata
  backend membedakan keduanya di tempat lain (mis. tampil di kuitansi), sebut
  ke tim frontend.

  Tidak ada langkah OTP di endpoint ini - kirim body ini sekali, akun dan
  token langsung kembali. Kalau UI menampilkan langkah verifikasi kode
  sebelumnya, itu kosmetik di sisi konsol; endpoint ini tidak memintanya dan
  tidak memerlukan bukti apa pun darinya.

  Jalurnya `/org/auth/register`, bukan `/org/*` yang lain - endpoint ini
  tetap **publik**, tidak menuntut token, sementara `/org/*` yang lain
  menuntut peran `organizer` yang justru baru dibuat di sini.

  ## Yang dikembalikan

  `user` dan token, tidak ada objek `workspace` terpisah - diuji langsung,
  responsnya cuma `{ user, tokenType, accessToken, refreshToken, expiresIn,
  expiresAt }`. Kalau backend memang berencana mengembalikan workspace di sini
  juga nanti, sebut - dto ini akan menyesuaikan.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `409` | `shared/common/error-conflict.response.json` | Nomor WhatsApp atau email sudah terdaftar. |
  | `422` | `shared/common/error-validation.response.json` | Validasi gagal; pesan per field ada di `error.errors`. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.
  - **Paginasi** `page` / `perPage`, dan `meta` berisi `{ page, perPage, total, totalPages }`.

  Selengkapnya di `dto/README.md`.
