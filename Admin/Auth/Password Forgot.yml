info:
  name: Password Forgot
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/auth/password/forgot"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "channel": "email",
        "destination": "aziziabdul95@gmail.com"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("envelope lengkap", function () {
          const body = res.getBody();
          expect(res.getStatus()).to.be.below(400);
          expect(body).to.have.property("success", true);
          expect(body).to.have.property("message");
          expect(body).to.have.property("data");
          expect(body).to.have.property("meta");
        });
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "OTP sent successfully",
            "data": {
              "sentTo": "ke***6@gmail.com",
              "codeLength": 6,
              "resendAvailableAt": "2026-08-26T14:44:39.940+07:00",
              "attemptsAllowed": 3
            },
            "meta": null
          }

docs: |
  # Password Forgot

  Kirim kode OTP ke `destination` untuk memulai lupa-password. Tanpa token - orangnya belum masuk.

  | | |
  | --- | --- |
  | **Method** | `POST` |
  | **Path** | `/auth/password/forgot` |
  | **Auth** | Tidak perlu token |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/shared/auth/password-forgot.request.json`<br>`dto/shared/auth/password-forgot.response.json` |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `channel` | string | ya | enum `otpChannel`: `email`, `whatsapp` |
  | `destination` | string | ya |  |

  > Kolom **Wajib** diturunkan dari contoh: field yang bernilai `null`
  > dianggap opsional. Aturan validasi sesungguhnya ditentukan backend.

  ## Bukan lagi tautan email

  Dulu endpoint ini mengirim tautan reset lewat email, dan **Password Reset**
  menukarnya lewat field `token`. Sekarang dipasangkan dengan OTP, memakai jalur
  yang sama dengan verifikasi nomor di pendaftaran - hanya beda `purpose`:
  `"password_reset"`, bukan `"phone_verification"`. Bentuk response-nya sama
  persis dengan **OTP Request** (`sentTo`, `codeLength`, `resendAvailableAt`,
  `attemptsAllowed`) karena di balik layar ini memang endpoint OTP yang sama,
  cuma `purpose`-nya sudah ditetapkan server jadi frontend tidak perlu
  mengirimnya sendiri.

  Langkah berikutnya memakai **OTP Verify** yang sudah ada (`purpose:
  "password_reset"`) untuk menukar kode dengan `verificationToken` - lihat
  **Password Reset** untuk langkah terakhirnya.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `422` | `shared/common/error-validation.response.json` | Validasi gagal; pesan per field ada di `error.errors`. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.
  - **Paginasi** `page` / `perPage`, dan `meta` berisi `{ page, perPage, total, totalPages }`.

  Selengkapnya di `dto/README.md`.
