docs: |
  # Event Create

  Submit builder event (4 langkah).

  | | |
  | --- | --- |
  | **Method** | `POST` |
  | **Path** | `/organizer/experiences/events` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `201 Created` |
  | **Sumber** | `dto/organizer/event-create.request.json`<br>`dto/organizer/event-create.response.json` |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `kind` | string | ya | enum `experienceKind`: `event`, `activity` |
  | `identity` | object | ya |  |
  | `identity.title` | string | ya |  |
  | `identity.category` | string | ya |  |
  | `identity.summary` | string | ya |  |
  | `identity.coverImageUrl` | string | ya | URL |
  | `brand` | object | ya |  |
  | `brand.hostName` | string | ya |  |
  | `brand.hostType` | string | ya |  |
  | `brand.hostBio` | string | ya |  |
  | `brand.logoUrl` | — | tidak | selalu `null` di contoh — tipe ditentukan backend |
  | `brand.contactEmail` | string | ya | email |
  | `brand.contactPhone` | string | ya |  |
  | `benefits` | array | ya |  |
  | `format` | string | ya | enum `eventFormat`: `onsite`, `online`, `hybrid` |
  | `venue` | object | ya |  |
  | `venue.name` | string | ya |  |
  | `venue.area` | string | ya |  |
  | `venue.city` | string | ya |  |
  | `venue.address` | string | ya |  |
  | `venue.latitude` | number | ya |  |
  | `venue.longitude` | number | ya |  |
  | `venue.notes` | array | ya |  |
  | `onlineUrl` | — | tidak | selalu `null` di contoh — tipe ditentukan backend |
  | `startsAt` | string | ya | ISO 8601 `+07:00` |
  | `endsAt` | string | ya | ISO 8601 `+07:00` |
  | `timezone` | string | ya |  |
  | `rundown` | array | ya |  |
  | `rundown[].time` | string | ya | jam `HH:mm` |
  | `rundown[].label` | string | ya |  |
  | `ticketTypes` | array | ya |  |
  | `ticketTypes[].name` | string | ya |  |
  | `ticketTypes[].description` | string | ya |  |
  | `ticketTypes[].price` | integer | ya | integer polos di request (objek uang hanya di response) |
  | `ticketTypes[].quota` | integer | ya |  |
  | `ticketTypes[].salesStartAt` | string | ya | ISO 8601 `+07:00` |
  | `ticketTypes[].salesEndAt` | string | ya | ISO 8601 `+07:00` |
  | `publishSettings` | object | ya |  |
  | `publishSettings.visibility` | string | ya | enum `visibility`: `public`, `unlisted`, `private` |
  | `publishSettings.showOnDiscovery` | boolean | ya |  |
  | `publishSettings.allowWaitlist` | boolean | ya |  |
  | `publishSettings.publishMode` | string | ya | enum `publishMode`: `now`, `scheduled`, `draft` |
  | `publishSettings.scheduledAt` | string | ya | ISO 8601 `+07:00` |

  > Kolom **Wajib** diturunkan dari contoh: field yang bernilai `null`
  > dianggap opsional. Aturan validasi sesungguhnya ditentukan backend.

  ## `format` menentukan field mana yang wajib

  `onsite` butuh `venue`; `online` butuh `onlineUrl`; `hybrid` butuh keduanya.
  Langkah 2 builder berubah bentuk mengikuti pilihan ini, jadi validasi backend
  sebaiknya ikut bersyarat, bukan mewajibkan semuanya sekaligus.

  `rundown` adalah susunan acara `[{ time, label }]` — bukan `schedule`.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `403` | `shared/common/error-forbidden.response.json` | Akun tidak punya peran `organizer`. |
  | `422` | `shared/common/error-validation.response.json` | Validasi gagal; pesan per field ada di `error.errors`. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.
  - **Paginasi** `page` / `perPage`, dan `meta` berisi `{ page, perPage, total, totalPages }`.

  Selengkapnya di `dto/README.md`.
