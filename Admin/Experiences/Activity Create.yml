docs: |
  # Activity Create

  Submit builder aktivitas (5 langkah).

  | | |
  | --- | --- |
  | **Method** | `POST` |
  | **Path** | `/org/experiences/activities` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `201 Created` |
  | **Sumber** | `dto/organizer/activity-create.request.json`<br>`dto/organizer/activity-create.response.json` |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `kind` | string | ya | enum `experienceKind`: `event`, `activity` |
  | `identity` | object | ya |  |
  | `identity.title` | string | ya |  |
  | `identity.category` | string | ya |  |
  | `identity.summary` | string | ya |  |
  | `identity.coverImageUrl` | string | ya | URL |
  | `details` | object | ya |  |
  | `details.difficulty` | string | ya | enum `difficulty`: `beginner`, `intermediate`, `advanced` |
  | `details.language` | string | ya |  |
  | `details.visibility` | string | ya | enum `visibility`: `public`, `unlisted`, `private` |
  | `participantInfo` | object | ya |  |
  | `participantInfo.whatToBring` | array | ya |  |
  | `participantInfo.requirements` | array | ya |  |
  | `venue` | object | ya |  |
  | `venue.name` | string | ya |  |
  | `venue.area` | string | ya |  |
  | `venue.city` | string | ya |  |
  | `venue.address` | string | ya |  |
  | `venue.latitude` | number | ya |  |
  | `venue.longitude` | number | ya |  |
  | `venue.notes` | array | ya |  |
  | `schedule` | object | ya |  |
  | `schedule.startDate` | string | ya | tanggal `YYYY-MM-DD` |
  | `schedule.endDate` | — | tidak | selalu `null` di contoh — tipe ditentukan backend |
  | `schedule.noEndDate` | boolean | ya |  |
  | `schedule.repeatWeekly` | boolean | ya |  |
  | `schedule.operatingDays` | array | ya |  |
  | `schedule.skippedDates` | array | ya |  |
  | `schedule.pickedDates` | array | ya |  |
  | `schedule.timezone` | string | ya |  |
  | `sessions` | array | ya |  |
  | `sessions[].name` | string | ya |  |
  | `sessions[].startTime` | string | ya | jam `HH:mm` |
  | `sessions[].endTime` | string | ya | jam `HH:mm` |
  | `sessions[].weekdays` | array | ya |  |
  | `sessions[].capacity` | integer | ya |  |
  | `sessions[].price` | integer | ya | integer polos di request (objek uang hanya di response) |
  | `sessions[].instructor` | string | ya |  |
  | `sessions[].isActive` | boolean | ya |  |
  | `pricing` | object | ya |  |
  | `pricing.basePrice` | integer | ya | integer polos di request (objek uang hanya di response) |
  | `pricing.currency` | string | ya |  |
  | `pricing.defaultCapacity` | integer | ya |  |
  | `pricing.minParticipants` | integer | ya |  |
  | `booking` | object | ya |  |
  | `booking.opensBefore` | string | ya |  |
  | `booking.closesBefore` | string | ya |  |
  | `booking.confirmation` | string | ya | enum `bookingConfirmation`: `instant`, `manual` |
  | `booking.cancellationPolicy` | string | ya |  |
  | `booking.allowWaitlist` | boolean | ya |  |
  | `instructors` | array | ya |  |
  | `instructors[].name` | string | ya |  |
  | `instructors[].role` | string | ya |  |
  | `instructors[].bio` | string | ya |  |
  | `instructors[].expertise` | array | ya |  |
  | `instructors[].avatarUrl` | — | tidak | selalu `null` di contoh — tipe ditentukan backend |
  | `gallery` | array | ya |  |
  | `facilities` | array | ya |  |
  | `equipment` | array | ya |  |
  | `houseRules` | array | ya |  |
  | `publish` | object | ya |  |
  | `publish.mode` | string | ya | enum `publishMode`: `now`, `scheduled`, `draft` |
  | `publish.scheduledAt` | — | tidak | selalu `null` di contoh — tipe ditentukan backend |
  | `publish.showOnDiscovery` | boolean | ya |  |

  > Kolom **Wajib** diturunkan dari contoh: field yang bernilai `null`
  > dianggap opsional. Aturan validasi sesungguhnya ditentukan backend.

  ## Hidup di tunnel (`201`), masih 404 di SIT

  Dites 2026-08-26 lewat akun host uji coba yang didaftarkan sungguhan di
  tunnel - bukan cuma dibaca kodenya. `SIT (10.10.24.40:3436)` belum menyusul.

  Dua hal terbukti sekaligus: **`publish.mode: "draft"` benar-benar
  dihormati** - `GET /org/experiences` sesudahnya membalas
  `"publishState": "draft"` untuk baris yang baru dibuat, bukti ujung-ke-ujung
  pertama untuk perbaikan "Save as Draft" (lihat bagian bawah) - sebelumnya
  cuma terbukti sampai bentuk request-nya benar. Dan **empat field yang
  selama ini dikirim `null` ternyata wajib**: percobaan pertama dengan bentuk
  persis yang dikirim konsol (`venue.area`, `venue.city`, `venue.latitude`,
  `venue.longitude` semuanya `null`, plus `identity.coverImageUrl: null`)
  ditolak `422 VALIDATION_ERROR` yang menyebut kelimanya satu per satu.

  Ini bukan kejutan dari backend - contoh di `activity-create.request.json`
  **sudah lama** mengisi kelimanya (`area: "Kemang"`, `latitude: -6.2607`, dst).
  Yang belum sinkron adalah `src/lib/payload.ts`: wizard aktivitas
  (`StepVenue`) cuma mengumpulkan `venueName`/`address`/`meetingPoint`/
  `parking` - tidak ada field kota, area, atau koordinat - jadi `payload.ts`
  tidak punya apa pun untuk dikirim selain `null`. **Konsol tidak bisa
  membuat aktivitas sungguhan sampai wizard menambah field-field itu, atau
  backend melonggarkan validasinya untuk desain yang memang tidak
  menanyakannya.** `coverImageUrl` sendiri bisa terisi begitu organizer
  mengunggah cover - jadi cuma memblokir saat draf belum punya cover.

  Ditemukan sekalian: `GET /org/experiences` membalas `sessions[].price`
  sebagai integer polos, sedangkan `pricing.basePrice` dan `revenue` di
  respons yang sama sudah benar `{ amount, currency }` - pelanggaran konvensi
  uang baru, beda dari `ticketTypes[].price` milik event. Belum berdampak -
  `adapt.ts` tidak membaca `sessions[].price` dari daftar experience.

  ## Alur gambar

  Gambar diunggah lebih dulu lewat **Media → Upload**, yang mengembalikan `url`.
  `url` itulah yang dikirim sebagai `coverImageUrl` dan `gallery[]` di sini, jadi
  submit builder tetap JSON murni — tidak ada multipart di endpoint ini.

  ## Nama yang mudah tertukar

  - `pricing` = langkah harga di builder (`basePrice`, `defaultCapacity`).
  - `price` = integer polos di request; objek uang `{ amount, currency }` hanya di response.
  - `schedule` = konfigurasi jadwal builder (`operatingDays`, `repeatWeekly`, …),
    bukan baris tampilan katalog (itu `scheduleSummary`) dan bukan susunan acara
    (itu `rundown`, milik event).

  ## Bug konsol yang sudah diperbaiki lebih dulu

  `publish.mode` di sini punya tiga nilai sah - `now`, `later`, `draft` (lihat
  `publishMode` di `dto/shared/common/enums.reference.json`). Tombol
  **"Save as Draft"** di wizard aktivitas dulu tidak pernah mengirim `draft` -
  `PublishWhen` di sisi konsol cuma punya `'now' | 'later'`, jadi menekan
  "Save as Draft" tetap mengirim apa pun pilihan radio "publish now/later"
  yang sedang aktif. Event builder sudah lebih dulu punya bug yang persis
  sama (`registrationStatus` yang tidak pernah dipaksa `'draft'`) dan sudah
  diperbaiki; audit ini menemukan Activity belum ikut diperbaiki. Sekarang
  `saveDraft()` di `CreateActivity.tsx` mengirim salinan draft dengan
  `publishWhen: 'draft'` dipaksa, persis pola perbaikan event. Sekarang
  terbukti sampai balasan `201`-nya sendiri, bukan cuma bentuk request-nya -
  lihat catatan di atas.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `403` | `shared/common/error-forbidden.response.json` | Akun tidak punya peran `organizer`. |
  | `422` | `shared/common/error-validation.response.json` | Validasi gagal; pesan per field ada di `error.errors`. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.
  - **Paginasi** `page` / `perPage`, dan `meta` berisi `{ page, perPage, total, totalPages }`.

  Selengkapnya di `dto/README.md`.
