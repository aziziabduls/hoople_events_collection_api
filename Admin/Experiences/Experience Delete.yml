info:
  name: Experience Delete
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{baseUrl}}/org/experiences/{{experienceId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"
  scripts:
    - type: tests
      code: |-
        test("envelope lengkap", function () {
          const body = res.getBody();
          expect(res.getStatus()).to.be.below(400);
          expect(body).to.have.property("success", true);
          expect(body).to.have.property("message");
          expect(body).to.have.property("data");
          expect(body).to.have.property("meta");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Sukses"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Experience berhasil dihapus",
            "data": {
              "id": "e1f2a3b4-5555-4c5d-9e6f-000000000205",
              "deletedAt": "2026-03-14T09:30:00+07:00"
            },
            "meta": null
          }

docs: |
  # Experience Delete

  Hapus (soft delete).

  | | |
  | --- | --- |
  | **Method** | `DELETE` |
  | **Path** | `/org/experiences/{{experienceId}}` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/organizer/experience-delete.response.json` |

  ## Variabel yang dipakai

  | Variabel | Untuk |
  | --- | --- |
  | `{{experienceId}}` | UUID experience — ambil dari **Experience List** |

  Keduanya diisi di environment, bukan ditulis langsung di URL, supaya
  pindah environment tidak berarti menyunting request.

  ## Hidup, tapi cuma untuk draft

  Dites langsung ke tunnel: menghapus event yang `publishState: "published"`
  ditolak `409` - `"Cannot delete an event that is not in draft mode"`.

  Karena **Event Create** selalu membuat event langsung `published` (lihat
  catatan di request itu), event yang baru dibuat **tidak bisa langsung
  dihapus**. Yang terbukti berhasil: kirim dulu **Experience Update** dengan
  body `{ "status": "draft" }` (diterima `200` walau bukan salah satu field
  bersarang yang terdokumentasi di request itu), baru kirim `DELETE` di sini -
  balas `200` dan resource-nya benar-benar hilang: `GET` detail sesudahnya
  balas `404`, dan baris itu tidak lagi muncul di **Experience List**.

  Draft yang memang belum pernah dipublish seharusnya bisa langsung dihapus
  tanpa langkah `status: draft` ini dulu - belum sempat diuji karena builder
  selalu mem-publish saat submit pertama.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `403` | `shared/common/error-forbidden.response.json` | Akun tidak punya peran `organizer`. |
  | `404` | `shared/common/error-not-found.response.json` | Resource tidak ada atau bukan milik workspace ini. |
  | `409` | `shared/common/error-conflict.response.json` | Bentrok state. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.
  - **Paginasi** `page` / `perPage`, dan `meta` berisi `{ page, perPage, total, totalPages }`.

  Selengkapnya di `dto/README.md`.
