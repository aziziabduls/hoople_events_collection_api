docs: |
  # Experience List

  Daftar experience; `scope` menggerakkan keempat tab.

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/org/experiences` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/organizer/experience-list.response.json` |

  ## Query parameter

  | Parameter | Contoh | Catatan |
  | --- | --- | --- |
  | `scope` | `all` | Salah satu: all, events, activities, drafts. Menggerakkan keempat tab konsol. |
  | `page` | `1` | Nomor halaman, mulai 1. Diturunkan dari `meta`. |
  | `perPage` | `10` | Baris per halaman. Contoh dto memakai 10. |

  ## Bentuk nyata, dikonfirmasi lewat pengujian langsung ke tunnel

  Contoh JSON di panel Body **bukan lagi bentuk yang benar** — itu peninggalan
  draf awal kontrak. Endpoint ini sudah hidup dan diuji ke backend sungguhan;
  bentuk aslinya:

  - `identity` **bersarang**: `{ title, summary, category, coverImageUrl }` —
    bukan field rata (`title`, `summary`, dst di level atas).
  - `publishState` (`draft` | `published` | `cancelled`) dan `lifecycle`
    (`upcoming` | `ongoing` | `completed` | `cancelled`) **memang field API
    asli yang dikirim backend** — bukan kekeliruan, dan bukan sesuatu yang
    perlu dipecah dari satu field `status`. Draf dokumen ini dulu sempat minta
    backend hanya kirim `status` tunggal; itu sudah tidak berlaku. Konsol kini
    membaca kedua field ini langsung (`publishStateFrom()`/`lifecycleFrom()`
    di `src/lib/adapt.ts`), tidak lagi menghitung sendiri dari tanggal.
  - `slug`, `venue`, `registeredCount`, `capacity`, `revenue`,
    `sessionCount`, `createdAt`, `publishedAt` **belum dikirim sama sekali**
    oleh endpoint ini. Konsol menampilkannya kosong/0, bukan menganggapnya
    error — tapi kalau backend sudah bisa mengirimkannya, field-field ini akan
    langsung terpakai tanpa perubahan kode.

  Lihat `dto/README.md` bagian catatan status untuk detail lengkap semua
  endpoint yang sudah diuji langsung.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `403` | `shared/common/error-forbidden.response.json` | Akun tidak punya peran `organizer`. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.
  - **Paginasi** `page` / `perPage`, dan `meta` berisi `{ page, perPage, total, totalPages }`.

  Selengkapnya di `dto/README.md`.
