runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"
  scripts:
    - type: tests
      code: |-
        test("envelope lengkap", function () {
          const body = res.getBody();
          expect(res.getStatus()).to.be.below(400);
          expect(body).to.have.property("success", true);
          expect(body).to.have.property("message");
          expect(body).to.have.property("data");
          expect(body).to.have.property("meta");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Settings Update

  Simpan pengaturan. **Hidup dan terbukti menyimpan** per 2026-09-03 di tunnel;
  masih `404` di `dev-api-event` dan SIT — selama itu tombol simpan di konsol
  melaporkan kegagalannya apa adanya.

  | | |
  | --- | --- |
  | **Method** | `PATCH` |
  | **Path** | `/org/settings` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/organizer/settings-update.request.json` |

  ## Tiga field yang wajib menyertai blok `workspace`

  Validator menolak seluruh panggilan kalau blok `workspace` dikirim tanpa
  `category`, `contactEmail` dan `contactPhone` — walau tidak ada satu pun layar
  yang masih menampilkan ketiganya (Category sudah menjadi Bio, dan dua kontak
  itu menduplikasi `email`/`phone`). Jadi konsol **menyalin ketiganya kembali**
  dari hasil `GET` terakhir setiap kali menyimpan, termasuk saat yang berubah
  cuma rekening bank. Kalau validator bisa dilonggarkan, kabari — salinan itu
  akan dihapus.

  ## Yang dikirim tab Payout Information

  Satu `PATCH` berisi empat blok sekaligus:

  ```json
  {
    "workspace": { "…salinan dari GET…" },
    "fee": { "feeBearer": "buyer" },
    "bankAccount": {
      "bankCode": "BCA",
      "bankName": "Bank Central Asia",
      "accountNumber": "1234567890",
      "accountHolderName": "Waktu Luang Komunitas",
      "branchName": "KCP Setiabudi"
    },
    "bankAccounts": [ { "…rekening yang sama, isPrimary: true…" } ],
    "taxInfo": {
      "npwpNumber": "12.345.678.9-012.000",
      "npwpDocumentUrl": "https://cdn.hoople.id/tax/npwp-waktu-luang.pdf",
      "npwpDocumentName": "NPWP_WaktuLuang.pdf"
    }
  }
  ```

  | Field | Status | Catatan |
  | --- | --- | --- |
  | `bankAccount.branchName` | **baru, diminta** | Nama cabang, mis. `KCP Setiabudi`. Kosong boleh. |
  | `taxInfo.npwpNumber` | **baru, diminta** | Format `00.000.000.0-000.000`, 15 digit. Konsol memformat sendiri saat diketik dan menolak yang kurang dari 15 digit. |
  | `taxInfo.npwpDocumentUrl` | **baru, diminta** | URL hasil `POST /org/media/upload`. `null` kalau belum ada. |
  | `taxInfo.npwpDocumentName` | **baru, diminta** | Nama berkas aslinya, untuk ditampilkan. |
  | `bankAccounts[]` | opsional | Diabaikan kalau backend hanya menyimpan satu rekening. |
  | `fee.feeBearer` | sudah ada | `buyer` (default) atau `organizer`. Kalau `organizer`, backend yang memotong platform fee dan `net` di `/org/payouts` sudah bersih. |

  Yang wajib dijawab balik: apa pun yang disimpan harus ikut muncul di
  `GET /org/settings` berikutnya. Konsol membaca ulang sesudah menyimpan dan
  mengisi formulirnya dari jawaban itu — field yang diterima tapi tidak
  dikembalikan akan terlihat seperti gagal tersimpan.

  ## Yang dikirim Organizer Profile dan Account Settings (2026-09-21)

  **Organizer Profile** mengirim satu `PATCH` berisi blok `workspace` saja:

  ```json
  {
    "workspace": {
      "name": "Waktu Luang",
      "description": "A community for people who enjoy meaningful experiences…",
      "website": "https://www.waktuluang.id",
      "coverImageUrl": "https://cdn.hoople.id/org/waktu-luang/cover.jpg",
      "city": "Jakarta, Indonesia",
      "socials": [
        { "platform": "instagram", "url": "https://instagram.com/waktu.luang" },
        { "platform": "tiktok", "url": "https://www.tiktok.com/@waktuluang" }
      ],
      "slug": "…", "email": "…", "phone": "…",
      "contactEmail": "…", "contactPhone": "…", "category": "…"
    }
  }
  ```

  | Field | Status | Catatan |
  | --- | --- | --- |
  | `workspace.coverImageUrl` | **baru, diminta** | URL hasil `POST /org/media/upload`, atau `null` untuk menghapus. Konsol tidak pernah mengirim data URL. |
  | `workspace.city` | **baru, diminta** | String utuh, `null` kalau dikosongkan. |
  | `workspace.socials` | **baru, diminta** | Ganti seluruhnya (bukan tambah): array yang dikirim adalah daftar akhirnya. |
  | `workspace.logoUrl` | tidak dikirim | Logo = avatar akun; konsol menulisnya lewat `PATCH /org/auth/me` dengan `avatarUrl`. |
  | enam field terakhir | salinan dari `GET` | Tiga yang wajib bagi validator plus `slug`/`email`/`phone` - layar ini tidak punya kotaknya. |

  **Account Settings** mengirim `workspace.name` saja (plus salinan yang
  sama) ketika nama diganti, dan `PATCH /org/auth/me` ketika telepon diganti;
  email masuk tidak bisa diubah dari konsol.

  ## Dokumen NPWP

  Diunggah lewat `POST /org/media/upload` yang sama dengan gambar, sebagai
  `multipart/form-data` dengan field `file`. **Tolong terima
  `application/pdf` di sana** — sekarang rute itu baru diuji dengan gambar.
  Batas yang dijanjikan layar 5 MB. Kalau lebih enak dipisah, sediakan
  `POST /org/settings/tax-document` dan kabari.

  ## `verifikasi`

  Layar tidak pernah memverifikasi apa pun sendiri. Setelah `PATCH` sukses ia
  hanya mengatakan "terkirim untuk verifikasi". Yang menentukan status adalah
  `taxInfo.status` dan `bankAccount.isVerified` pada `GET` berikutnya.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `403` | `shared/common/error-forbidden.response.json` | Akun tidak punya peran `organizer`. |
  | `422` | `shared/common/error-validation.response.json` | Body tidak lolos validasi. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.

  Selengkapnya di `dto/README.md`.
