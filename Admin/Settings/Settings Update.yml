info:
  name: Settings Update
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/organizer/settings"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "workspace": {
          "name": "Waktu Luang",
          "category": "Community & Lifestyle",
          "description": "Kelas kreatif akhir pekan di Jakarta Selatan.",
          "contactEmail": "halo@waktuluang.id",
          "contactPhone": "+62 812 3456 7890",
          "socials": {
            "website": "https://waktuluang.id",
            "instagram": "@waktuluang",
            "youtube": null
          }
        },
        "payout": {
          "bankName": "BCA",
          "accountNumber": "1234567890",
          "accountHolder": "Adriani Ajeng",
          "payoutSchedule": "weekly"
        },
        "fees": {
          "absorbedByOrganizer": false
        },
        "notifications": {
          "newRegistration": true,
          "paymentReceived": true,
          "payoutSettled": true,
          "weeklyDigest": true
        }
      }

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"
  scripts:
    - type: tests
      code: |-
        test("envelope lengkap", function () {
          const body = res.getBody();
          expect(res.getStatus()).to.be.below(400);
          expect(body).to.have.property("success", true);
          expect(body).to.have.property("message");
          expect(body).to.have.property("data");
          expect(body).to.have.property("meta");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Settings Update

  Simpan pengaturan.

  | | |
  | --- | --- |
  | **Method** | `PATCH` |
  | **Path** | `/organizer/settings` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/organizer/settings-update.request.json` |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `workspace` | object | ya |  |
  | `workspace.name` | string | ya |  |
  | `workspace.category` | string | ya |  |
  | `workspace.description` | string | ya |  |
  | `workspace.contactEmail` | string | ya | email |
  | `workspace.contactPhone` | string | ya |  |
  | `workspace.socials` | object | ya |  |
  | `workspace.socials.website` | string | ya | URL |
  | `workspace.socials.instagram` | string | ya |  |
  | `workspace.socials.youtube` | — | tidak | selalu `null` di contoh — tipe ditentukan backend |
  | `payout` | object | ya |  |
  | `payout.bankName` | string | ya |  |
  | `payout.accountNumber` | string | ya |  |
  | `payout.accountHolder` | string | ya |  |
  | `payout.payoutSchedule` | string | ya | enum `payoutSchedule`: `daily`, `weekly`, `monthly` |
  | `fees` | object | ya |  |
  | `fees.absorbedByOrganizer` | boolean | ya |  |
  | `notifications` | object | ya |  |
  | `notifications.newRegistration` | boolean | ya |  |
  | `notifications.paymentReceived` | boolean | ya |  |
  | `notifications.payoutSettled` | boolean | ya |  |
  | `notifications.weeklyDigest` | boolean | ya |  |

  > Kolom **Wajib** diturunkan dari contoh: field yang bernilai `null`
  > dianggap opsional. Aturan validasi sesungguhnya ditentukan backend.

  > **`payout.payoutSchedule`, bukan `payout.schedule`.** `schedule` sudah
  > berarti konfigurasi jadwal di builder, jadi irama pencairan diberi nama
  > sendiri. Versi lama koleksi ini masih memakai `schedule` — itu salah.

  ## Response

  Sama seperti Experience Update, `dto/` belum mendefinisikan response-nya.
  Kembalikan objek settings yang sudah diperbarui (bentuk **Settings**) dan
  tambahkan `dto/organizer/settings-update.response.json`.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `403` | `shared/common/error-forbidden.response.json` | Akun tidak punya peran `organizer`. |
  | `422` | `shared/common/error-validation.response.json` | Validasi gagal; pesan per field ada di `error.errors`. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.
  - **Paginasi** `page` / `perPage`, dan `meta` berisi `{ page, perPage, total, totalPages }`.

  Selengkapnya di `dto/README.md`.
