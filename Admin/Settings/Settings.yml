docs: |
  # Settings

  Workspace, rekening payout, pajak, fee, paket, notifikasi. **Sudah hidup di
  tunnel per 2026-09-03** (masih 404 di `dev-api-event` dan SIT).

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/org/settings` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/organizer/settings.response.json` |

  ## Contoh di atas sudah disamakan dengan yang benar-benar dijawab server

  Contoh lama di koleksi ini memakai bentuk kontrak awal (`handle`, `socials`,
  `payout`, `fees`, `plan`, blok `owner`). Yang dijawab server hidup berbeda,
  dan **konsol sudah mengikuti yang hidup**:

  | Dulu di kontrak | Yang dijawab server |
  | --- | --- |
  | `workspace.handle` | `workspace.slug` |
  | `workspace.contactEmail` / `contactPhone` | `workspace.email` / `phone` (dua yang lama tetap diminta balik saat `PATCH`) |
  | `payout` | `bankAccount` |
  | `fees` | `fee` |
  | `plan` | `subscription` |
  | `notifications` datar | `notifications` bertingkat per kanal (`email`, `whatsapp`, `push`) |
  | `owner` | **tidak ada sama sekali** — nama orang diambil konsol dari respons login |

  Blok `owner` yang hilang itu pernah membuat konsol melempar `TypeError` dan
  diam-diam menampilkan workspace contoh. Jangan menambahkannya kembali tanpa
  memberi tahu; kalau memang mau ada, kabari supaya konsol membacanya.

  ## Yang dipakai layar Payments & Payout

  Tab **Payout Information** (`/organizer/payments`, tab ketiga) mengisi
  formulirnya dari tiga blok berikut:

  | Blok | Field | Dipakai untuk |
  | --- | --- | --- |
  | `bankAccount` | `bankCode`, `bankName`, `accountNumber`, `accountHolderName`, **`branchName`**, `isVerified` | Kartu 1 "Bank Account Details" |
  | `taxInfo` | **`npwpNumber`, `npwpDocumentUrl`, `npwpDocumentName`, `status`, `submittedAt`, `reviewedAt`, `rejectionReason`** | Kartu 2 "Tax Information (NPWP)" dan kolom "Verification Status" |
  | `fee` | `feeBearer` (`buyer` \| `organizer`) | Pilihan "I absorb the fees" di kartu 3 |

  `branchName` dan seluruh blok `taxInfo` **belum ada di server** — keduanya
  ditambahkan pada contoh ini sebagai permintaan. Selama `taxInfo.status`
  belum ada, kolom "Verification Status" diturunkan dari
  `bankAccount.isVerified` saja, jadi "Verified" di sana berarti rekeningnya
  yang terverifikasi, bukan pajaknya.

  `taxInfo.status`: `not_submitted | under_review | verified | rejected` —
  empat langkah yang persis ditampilkan di kolom kanan layar itu.

  ## `bankAccounts` (jamak)

  Konsol membaca `bankAccounts[]` kalau dikirim dan `bankAccount` kalau tidak.
  Sejak layar dibangun ulang 2026-09-17 **formulirnya hanya mengelola satu
  rekening**, jadi kalau backend lebih mudah mengirim satu saja, kirim
  `bankAccount` dan lupakan yang jamak. Kirim **nomor rekening yang sudah
  disamarkan** kalau kebijakan keamanan menghendaki; layar tidak pernah
  menampilkannya utuh.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `403` | `shared/common/error-forbidden.response.json` | Akun tidak punya peran `organizer`. |
  | `422` | `shared/common/error-validation.response.json` | Body tidak lolos validasi. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.

  Selengkapnya di `dto/README.md`.
