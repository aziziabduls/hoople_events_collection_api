info:
  name: Analytics
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/organizer/analytics"
  auth: inherit
  params:
    - name: from
      value: "2026-01-01"
      type: query
      description: "Awal periode, `YYYY-MM-DD`."
    - name: to
      value: "2026-03-14"
      type: query
      description: "Akhir periode, `YYYY-MM-DD`."

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"
  scripts:
    - type: tests
      code: |-
        test("envelope lengkap", function () {
          const body = res.getBody();
          expect(res.getStatus()).to.be.below(400);
          expect(body).to.have.property("success", true);
          expect(body).to.have.property("message");
          expect(body).to.have.property("data");
          expect(body).to.have.property("meta");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

