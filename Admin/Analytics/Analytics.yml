info:
  name: Analytics
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/org/analytics"
  auth: inherit
  params:
    - name: from
      value: "2026-06-22"
      type: query
      description: "Awal periode, `YYYY-MM-DD`, inklusif. Opsional - tanpa ini berarti sejak awal."
    - name: to
      value: "2026-07-19"
      type: query
      description: "Akhir periode, `YYYY-MM-DD`, inklusif. Opsional - tanpa ini berarti sampai hari ini."

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"
  scripts:
    - type: tests
      code: |-
        test("envelope lengkap", function () {
          const body = res.getBody();
          expect(res.getStatus()).to.be.below(400);
          expect(body).to.have.property("success", true);
          expect(body).to.have.property("message");
          expect(body).to.have.property("data");
          expect(body).to.have.property("meta");
        });

        test("period mengulang rentang yang benar-benar dipakai", function () {
          const period = res.getBody().data.period;
          expect(period.from).to.match(/^\d{4}-\d{2}-\d{2}$/);
          expect(period.to).to.match(/^\d{4}-\d{2}-\d{2}$/);
          expect(period.from <= period.to, "from <= to").to.equal(true);
          expect(period).to.have.property("event");
        });

        test("summary membawa angka yang dibaca kelima kartu", function () {
          const s = res.getBody().data.summary;
          ["registrations", "paidTickets", "unpaidTickets", "attended", "paidNoShow",
           "refundedTickets", "platformFeeRate", "gatewayFeeRate"].forEach(function (key) {
            expect(s, key).to.have.property(key).that.is.a("number");
          });
          ["grossRevenue", "platformFee", "gatewayFee", "refunds"].forEach(function (key) {
            expect(s[key], key).to.have.property("amount").that.is.a("number");
            expect(s[key], key).to.have.property("currency", "IDR");
          });
          expect(s.paidTickets + s.unpaidTickets, "paid + unpaid = registrations").to.equal(s.registrations);
        });

        test("registrationStatus, kalau ada, berjumlah = registrations", function () {
          const s = res.getBody().data.summary;
          if (!s.registrationStatus) return;
          const r = s.registrationStatus;
          expect(r.confirmed + r.pending + r.cancelled).to.equal(s.registrations);
        });

        test("rate dan angka 'previous' dalam skala yang benar", function () {
          const s = res.getBody().data.summary;
          ["previousPaidRate", "previousAttendanceRate"].forEach(function (key) {
            if (s[key] == null) return;
            expect(s[key], key).to.be.within(0, 1);
          });
          expect(s.platformFeeRate).to.be.within(0, 1);
          expect(s.gatewayFeeRate).to.be.within(0, 1);
        });

        test("daily: satu baris per hari, urut, di dalam periode, jumlahnya = registrations", function () {
          const data = res.getBody().data;
          const days = data.daily;
          expect(days).to.be.an("array");
          let sum = 0;
          days.forEach(function (day, i) {
            expect(day.date, "date").to.match(/^\d{4}-\d{2}-\d{2}$/);
            expect(day.date >= data.period.from && day.date <= data.period.to, day.date + " di dalam periode").to.equal(true);
            if (i > 0) expect(day.date > days[i - 1].date, day.date + " urut naik").to.equal(true);
            expect(day.registrations, day.date).to.be.a("number");
            expect(day.revenue, day.date).to.have.property("amount");
            if (day.attendees != null) expect(day.attendees, day.date + " attendees <= registrations").to.be.at.most(day.registrations);
            sum += day.registrations;
          });
          expect(sum, "jumlah daily[].registrations").to.equal(data.summary.registrations);
        });

        test("events: field yang dibaca tabel Event Performance dan Popular Experiences", function () {
          res.getBody().data.events.forEach(function (row) {
            ["id", "title", "date", "filled", "capacity", "paidRate", "attendanceRate", "netRevenue", "health"].forEach(function (key) {
              expect(row, row.title + "." + key).to.have.property(key);
            });
            expect(row.date, row.title).to.match(/^\d{4}-\d{2}-\d{2}$/);
            expect(["needs_promo", "healthy", "almost_full"], row.title).to.include(row.health);
            expect(row.paidRate, row.title + " paidRate").to.be.within(0, 1);
            expect(row.attendanceRate, row.title + " attendanceRate").to.be.within(0, 1);
            expect(row.netRevenue, row.title).to.have.property("amount");
            if (row.attended != null) expect(row.attended, row.title + " attended <= filled").to.be.at.most(row.filled);
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

