docs: |
  # Analytics

  Satu periode, angka-angka di baliknya. **Hanya tab Overview yang membaca
  endpoint ini**; tiga tab lain dan halaman per event dihitung konsol dari
  `GET /org/registrations` (lihat dokumen folder). Sampai endpoint ini hidup,
  Overview di akun asli masih menampilkan data demo - satu-satunya layar
  konsol yang begitu.

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/org/analytics` |
  | **Auth** | Wajib - `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK`, `meta: null` |
  | **Sumber** | `dto/organizer/analytics.response.json` |
  | **Status** | Belum hidup di deployment mana pun per 2026-09-21 (404). |

  Prinsipnya: **backend mengirim angka, konsol yang menyusun kalimat,
  persentase dan delta.** Tidak ada field berupa kalimat yang dibaca.

  ## Query parameter

  | Parameter | Contoh | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `from` | `2026-06-22` | tidak | Awal periode, inklusif. Tanpa ini: sejak data pertama. |
  | `to` | `2026-07-19` | tidak | Akhir periode, inklusif. Tanpa ini: sampai hari ini. |
  | `event` | UUID | tidak | Kalau ada, semua angka (summary, daily, events) hanya untuk experience itu; `events[]` berisi satu baris. |

  **Ketiganya opsional dan boleh datang sendiri-sendiri.** Konsol membuka
  halaman tanpa parameter sama sekali - permintaan pertama tidak membawa
  `from`/`to`, dan backend memakai periode default-nya (disarankan 28 hari
  terakhir sampai hari ini). Rentang yang belum lengkap juga wajar: pemilih
  tanggal mengirim `from` saja di antara dua kliknya.

  ## `period` - wajib mengulang apa yang dipakai

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `from` | `YYYY-MM-DD` | ya | Awal periode yang **benar-benar dipakai** - kalau backend yang memilih default, tulis di sini. |
  | `to` | `YYYY-MM-DD` | ya | Akhir periode yang dipakai. |
  | `event` | UUID \| null | ya | Filter event yang dipakai, `null` kalau tidak ada. |

  Konsol membaca `period`, bukan URL-nya, untuk menuliskan periode di
  toolbar dan menghitung **periode sebelumnya** = rentang sepanjang sama yang
  berakhir sehari sebelum `from`. Semua field `previous*` di bawah harus
  dihitung atas rentang itu, supaya "vs last period" di layar dan periode yang
  tertulis di sebelahnya cocok.

  ## `summary` - lima kartu Overview dan tiga breakdown

  | Field | Tipe | Wajib | Dipakai di mana |
  | --- | --- | --- | --- |
  | `registrations` | integer | ya | Kartu **Total Registrations**; satu tiket = satu registrasi. Harus = jumlah `daily[].registrations`. |
  | `previousRegistrations` | integer \| null | tidak | Delta kartu Total Registrations. `null` = delta tidak digambar. |
  | `paidTickets` / `unpaidTickets` | integer | ya | Tiket `confirmed` vs yang bukan. `paid + unpaid = registrations`. |
  | `previousPaidRate` | 0-1 \| null | tidak | Belum digambar; disediakan untuk sparkline. |
  | `grossRevenue` | money | ya | Bruto penjualan periode ini. |
  | `platformFee` / `platformFeeRate` | money / 0-1 | ya | Fee Hoople yang terkumpul + tarifnya. |
  | `gatewayFee` / `gatewayFeeRate` | money / 0-1 | ya | Fee gateway pembayaran + tarifnya. |
  | `refunds` / `refundedTickets` | money / integer | ya | Refund yang disetujui dalam periode. |
  | `previousNetRevenue` | money \| null | tidak | Delta kartu **Net Revenue**. |
  | `attended` | integer | ya | Kartu **Total Participants** = orang yang check-in; donat Attendance Overview. |
  | `previousAttended` | integer \| null | tidak | Delta kartu Total Participants. |
  | `paidNoShow` | integer | ya | Tiket terbayar yang tidak check-in di event yang sudah lewat. |
  | `previousAttendanceRate` | 0-1 \| null | tidak | Delta kartu **Attendance Rate**. |
  | `registrationStatus` | `{ confirmed, pending, cancelled }` \| null | tidak | Donat **Registration Status**; jumlahnya = `registrations`. Tanpa ini semua dianggap confirmed. |
  | `profileViews` / `previousProfileViews` | integer \| null | tidak | Kartu **Profile Views** = pengunjung unik halaman profil publik organizer dalam periode. Tanpa ini kartunya 0 - butuh penghitung di sisi publik. |
  | `seatsFilled` / `seatsTotal` / `sessions` / `previousOccupancy` / `noShowNote` / `trends` | - | tidak | **Tidak digambar layar mana pun sejak 2026-09-17.** Masih ada di contoh; boleh 0 / `null` / dihilangkan. |

  Rumus yang dihitung konsol dari field di atas - jangan kirim hasilnya:

  ```
  Net Revenue      = grossRevenue − platformFee − gatewayFee − refunds
  Attendance Rate  = attended ÷ registrationStatus.confirmed   (÷ registrations kalau tidak ada)
  vs last period   = (nilai − previous) ÷ previous              (kosong kalau previous null / 0)
  ```

  ## `daily[]` - tren Registrations & Attendees dan bar Revenue

  Satu baris **per hari kalender** di dalam `period`, urut naik, tanpa hari
  yang dilompati (hari kosong = `registrations: 0`). Konsol menggambar
  28 titik untuk 28 hari; kalau periode 400 hari, kirim 400 baris.

  | Field | Tipe | Wajib | Dipakai di mana |
  | --- | --- | --- | --- |
  | `date` | `YYYY-MM-DD` | ya | Sumbu X. |
  | `registrations` | integer | ya | Garis Registrations. |
  | `attendees` | integer \| null | tidak | Garis Attendees. **Kohort per hari daftar**: dari yang mendaftar hari itu, berapa yang kemudian check-in - **bukan** jumlah check-in pada hari itu (yang itu melonjak di hari event dan terbaca sebagai noise). Selalu <= `registrations`. |
  | `revenue` | money | ya | Bar Revenue Overview (bruto hari itu). |
  | `previousRegistrations` / `previousRevenue` | integer / money \| null | tidak | Hari yang sama satu periode sebelumnya. Diekspor ke CSV; belum digambar. |

  ## `events[]` - Popular Experiences dan tabel Event Performance

  Setiap event workspace yang **tanggalnya** jatuh di dalam `period`
  (event diambil utuh berdasarkan tanggal event, bukan tanggal penjualannya),
  atau satu baris kalau `?event=` dipakai. Urutan bebas - konsol mengurutkan
  sendiri (Popular Experiences: attendees / registrations / revenue; tabel:
  kolom apa pun).

  | Field | Tipe | Wajib | Dipakai di mana |
  | --- | --- | --- | --- |
  | `id` | UUID | ya | Tautan ke `/organizer/analytics/events/:id` dan filter `?event=`. Harus = id di `GET /org/experiences`. |
  | `title` | string | ya | Nama event. |
  | `date` | `YYYY-MM-DD` | ya | Kolom Date, filter periode, dan Upcoming/Completed (dibanding hari ini). **Baris tanpa `date` tidak ditampilkan.** |
  | `startTime` / `endTime` | `HH:MM` \| null | tidak | Header halaman per event. |
  | `venue` | string \| null | tidak | Header halaman per event. |
  | `format` | `onsite` \| `online` \| `hybrid` \| null | tidak | Pil format di header per event. |
  | `coverImageUrl` | URL \| null | tidak | Thumbnail di Popular Experiences dan tabel. |
  | `filled` | integer | ya | Registrations (tiket terjual, semua status). |
  | `attended` | integer \| null | tidak | Checked-in. Tanpa ini konsol memakai `round(filled × attendanceRate)`. |
  | `capacity` | integer | ya | Kuota total tiket. |
  | `paidRate` | 0-1 | ya | Paid = `round(filled × paidRate)`; No-show = paid − attended. |
  | `attendanceRate` | 0-1 | ya | Kolom Attendance Rate. |
  | `netRevenue` | money | ya | Kolom Net Revenue; dasar peringkat "Revenue". |
  | `health` | `needs_promo` \| `healthy` \| `almost_full` | ya | Keputusan backend; konsol hanya mewarnai dan mengekspor. |
  | `when` | string | ya (boleh `""`) | Hanya ikut ke CSV. Kalimat siap tampil ("28 Jul · 13.00 · Kolaborasi Space") - peninggalan kontrak lama; boleh string kosong. |

  ## `generatedAt`

  Instant kapan angka dihitung. Opsional; ditulis kecil di bawah judul kalau
  ada, berguna kalau backend meng-cache hasilnya.

  ## Workspace kosong

  Workspace tanpa event menjawab `summary` berisi nol, `daily[]` tetap satu
  baris per hari (semuanya 0) dan `events: []`. Konsol menggambar kartu nol
  dan "No events in this period" - jangan kirim angka contoh.

  ## Yang tidak dibaca lagi

  `insights`, `live`, `funnel`, `sources`, `audience` dan `revenue` dari
  kontrak sebelum 2026-09-17 **sudah dihapus dari contoh** dan tidak dibaca.
  Kalau terlanjur dikirim, diabaikan - tapi jangan dibangun.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `403` | `shared/common/error-forbidden.response.json` | Akun tidak punya peran `organizer`. |
  | `422` | `shared/common/error-validation.response.json` | `from`/`to` bukan `YYYY-MM-DD`, `to` sebelum `from`, atau `event` bukan UUID milik workspace ini. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "from": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Rate** selalu pecahan 0-1 (`0.843`), bukan persen. Konsol yang menulis `84,3%`.
  - **Tanggal polos** `YYYY-MM-DD` (`period`, `daily[].date`, `events[].date`); **instant** (`generatedAt`) ISO 8601 `+07:00`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan; field yang ditandai opsional boleh absen sama sekali.
  - `meta` selalu `null` di sini - tidak ada paginasi.

  Selengkapnya di `dto/README.md`.
