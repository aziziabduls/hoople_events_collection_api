docs: |
  # User Management

  Staff check-in: host membuat akun untuk seseorang untuk menjaga pintu satu
  event, tanpa memberi akses penuh sebagai `organizer`. Ditulis 2026-09-30 dari
  sisi konsol, yang sudah dibangun dan berjalan di mode prototipe (tanpa
  backend) - **lima endpoint di folder ini belum ada di server mana pun**.
  Ini rancangan/permintaan, bukan laporan endpoint yang sudah hidup seperti
  folder lain.

  **Disederhanakan dari rancangan pertama** (juga 2026-09-30, sore harinya):
  awalnya staff diundang lewat tautan email dan mengisi nama + password
  sendiri di halaman verifikasi terpisah - itu dua endpoint tambahan
  (`invite/lookup`, `invite/complete`) yang **tidak jadi dibuat**. Sekarang
  Host langsung mengisi nama + email + event sekali jalan, backend membuat
  password sementara, dan staff login lewat halaman sign-in biasa yang sudah
  ada. Kalau backend sempat mulai mengerjakan dua endpoint lama itu, boleh
  dihentikan.

  Konsol: menu **User Management** di sidebar Host (`/organizer/users`,
  persis di bawah Check-in), `/organizer/account` (satu-satunya halaman lain
  yang boleh dibuka akun `checker`, untuk ganti password), dan
  `/organizer/check-in` untuk akun `checker` yang sudah masuk.

  ## Peta layar → endpoint

  | Layar | Yang ditampilkan | Endpoint |
  | --- | --- | --- |
  | **User Management** (Host) | Daftar staff: nama, email, event yang diassign | `GET /org/checkers` |
  | **Add Staff** (dialog) | Isi nama + email, pilih satu event → akun langsung aktif | `POST /org/checkers` |
  | **Edit** (dialog) | Pindahkan staff ke event lain | `PATCH /org/checkers/{id}` |
  | **Delete** (menu titik-tiga) | Hapus staff | `DELETE /org/checkers/{id}` |
  | **Check-in**, akun `checker` | Event yang sedang diassign ke akun yang sedang login | `GET /org/checkers/me` |
  | **`/organizer/account`**, akun `checker` | Ganti password | `POST /auth/password/reset` (mode sudah-login, sama dengan yang dipakai Host - lihat folder **Auth**) |

  Yang **tidak** butuh endpoint sendiri: staff sign in lewat
  `POST /org/auth/login` yang sama dengan Host, tidak ada endpoint
  sign-in/verifikasi terpisah untuk peran ini. Backend juga **tidak perlu
  mengirim email sama sekali** untuk peran ini - Host menyampaikan email +
  password sementara ke staff sendiri, di luar sistem.

  ## Aturan inti: satu checker, satu event, sekaligus

  Diminta eksplisit oleh produk: **seorang checker tidak boleh diassign ke
  lebih dari satu event pada waktu yang sama**. Karena itu `eventId` di
  `Checker` adalah **satu field, bukan array** - `PATCH /org/checkers/{id}`
  dengan `eventId` baru **menimpa** assignment lama dalam satu panggilan.
  Konsol tidak pernah memanggil `DELETE` dulu sebelum `PATCH`, jadi kalau
  aturan "satu event" mau ditegakkan di server, itu harus terjadi di dalam
  `PATCH` yang sama - lihat pertanyaan #1.

  ## Peran baru: `checker`

  `"checker"` ditambahkan ke enum `role` di
  `dto/shared/common/enums.reference.json` (sebelumnya
  `["participant", "organizer", "teams_admin"]`) - ini perubahan `shared/`,
  jadi situs peserta dan Teams perlu diberi tahu kalau mereka pernah
  membaca daftar `role` yang lama. Akun `checker`:

  - **Dibuat lewat `POST /org/checkers`**, aktif seketika - bukan
    `POST /org/auth/register` (itu jalur pendaftaran-sendiri host/peserta)
    dan bukan lewat tautan verifikasi terpisah.
  - **Login lewat `POST /org/auth/login` yang sama** dengan host, memakai
    email + `temporaryPassword` yang diberikan Host - konsol membaca `roles`
    dari balasannya dan mengunci navigasinya ke Check-in (plus
    `/organizer/account` untuk ganti password) begitu `roles` cuma berisi
    `"checker"` (tidak ada `"organizer"` atau `"teams_admin"` di dalamnya).
  - **Hanya boleh memanggil**: `GET /org/checkers/me`, endpoint check-in
    (`POST /org/registrations/check-in`, lihat folder **Check-in**), dan
    `POST /auth/password/reset` mode sudah-login. Kalau backend punya cara
    memvalidasi ini di sisi server (menolak `organizer`-only endpoints untuk
    token berperan `checker` semata), itu jaring pengaman tambahan yang
    konsol sendiri tidak bisa berikan - guard-nya sekarang murni di UI
    (`RequireAuth` mengunci rute, tapi itu bisa dilewati dengan memanggil API
    langsung).

  ## Urutan mengerjakannya

  1. **`POST /org/checkers`** dan **`GET /org/checkers`** - begitu ini
     hidup, layar User Management langsung terisi dan host bisa menambahkan
     staff sungguhan. Ini yang paling berdampak, dan satu-satunya yang perlu
     hidup untuk seluruh alur berjalan (login staff memakai
     `POST /org/auth/login` yang sudah ada).
  2. **`PATCH /org/checkers/{id}`** dan **`DELETE /org/checkers/{id}`** -
     mengelola staff yang sudah ada.
  3. **`GET /org/checkers/me`** - baru dibutuhkan setelah checker pertama
     benar-benar bisa masuk (langkah 1 selesai). Lihat pertanyaan #2 -
     mungkin ini tidak perlu dibangun sama sekali.

  ## Pertanyaan untuk tim backend

  1. **Apakah "satu checker, satu event" ditegakkan di server?** Kalau ya,
     `PATCH /org/checkers/{id}` dengan `eventId` baru harus selalu berhasil
     menimpa assignment lama dalam satu panggilan - konsol tidak akan
     memanggil `DELETE` lebih dulu.
  2. **Apakah `GET /org/experiences` / `GET /org/sessions` yang dipanggil
     dengan token seorang `checker` otomatis dibatasi ke event yang
     diassign ke dia saja?** Kalau ya, **`GET /org/checkers/me` di folder
     ini mungkin tidak perlu dibangun** - konsol memakainya sebagai jalan
     aman sementara sampai ini dikonfirmasi, dan akan berhenti
     memanggilnya begitu jawabannya "ya".
  3. **Aturan kekuatan `temporaryPassword`** yang dibuat backend saat
     `POST /org/checkers` - disarankan mengikuti aturan yang sama dengan
     `register-host` (minimal 8 karakter, campuran huruf + angka), supaya
     tidak ada risiko password sementara itu sendiri ditolak saat staff
     memakai `POST /auth/password/reset` untuk menggantinya.

  Selengkapnya di `dto/README.md` §"Staff check-in (checker)".
