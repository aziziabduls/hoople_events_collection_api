info:
  name: Checker Invite Complete
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/org/checkers/invite/complete"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "chk_9f3a2b1c8d0e4f6a7b5c",
        "fullName": "Dewi Anjani",
        "password": "RahasiaKu123",
        "passwordConfirmation": "RahasiaKu123"
      }

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"
  scripts:
    - type: after-response
      code: |-
        // Menyimpan token akun checker ke environment - berguna untuk lanjut
        // uji **Checker Me** dan **Check-in → Checkin Scan** sebagai akun ini.
        // Jalankan Auth → Login lagi sesudahnya untuk kembali sebagai host.
        const body = res.getBody();
        if (body && body.success && body.data && body.data.accessToken) {
          bru.setEnvVar("accessToken", body.data.accessToken);
          if (body.data.refreshToken) bru.setEnvVar("refreshToken", body.data.refreshToken);
          console.log("accessToken checker disimpan ke environment aktif - ini BUKAN token host");
        }
    - type: tests
      code: |-
        test("envelope lengkap", function () {
          const body = res.getBody();
          expect(res.getStatus()).to.be.below(400);
          expect(body).to.have.property("success", true);
          expect(body).to.have.property("message");
          expect(body).to.have.property("data");
          expect(body).to.have.property("meta");
        });

        test("roles memuat checker", function () {
          const user = res.getBody().data.user;
          expect(user.roles).to.include("checker");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Sukses"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Verification successful",
            "data": {
              "user": {
                "id": "c7e5a1b2-3333-4a1c-9d2e-000000000301",
                "fullName": "Dewi Anjani",
                "email": "dewi.checker@example.com",
                "phone": null,
                "avatarUrl": null,
                "roles": ["checker"],
                "emailVerifiedAt": "2026-09-30T09:05:00+07:00",
                "createdAt": "2026-09-30T09:05:00+07:00"
              },
              "tokenType": "Bearer",
              "accessToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock-checker-access-token",
              "refreshToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock-checker-refresh-token",
              "expiresIn": 3600,
              "expiresAt": "2026-09-30T10:05:00+07:00"
            },
            "meta": null
          }
  - name: "Password tidak cocok"
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Validation failed",
            "data": null,
            "meta": null,
            "error": {
              "code": "VALIDATION_ERROR",
              "errors": { "passwordConfirmation": ["Passwords do not match"] }
            }
          }

docs: |
  # Checker Invite Complete

  Langkah terakhir layar verifikasi undangan: set nama + password, aktifkan
  akun `checker`, dan **langsung masuk** — bentuk responsnya sama persis
  dengan **Auth → Register Host**, supaya konsol bisa memakai jalur
  sign-in yang sama persis begitu ini berhasil.

  | | |
  | --- | --- |
  | **Method** | `POST` |
  | **Path** | `/org/checkers/invite/complete` |
  | **Auth** | **Tidak ada** — publik. Akunnya baru dibuat oleh panggilan ini sendiri. |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/organizer/checker-invite-complete.request.json`<br>`dto/organizer/checker-invite-complete.response.json` |
  | **Status** | **Belum dibangun di server mana pun.** |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `token` | string | ya | Token yang sama dengan **Checker Invite Lookup**. Dipanggil ulang di sini karena lookup dan complete adalah dua request terpisah — token tidak "dikunci" di antara keduanya. |
  | `fullName` | string | ya | Nama staff, diketik sendiri di form. |
  | `password` | string | ya | Aturan kekuatan password sama dengan **Auth → Register Host**: minimal 8 karakter, campuran huruf + angka. |
  | `passwordConfirmation` | string | ya | Harus identik dengan `password` — lihat contoh kedua untuk bentuk penolakannya. |

  ## Yang dikembalikan

  **Identik strukturnya dengan `register-host.response.json`**: `user`
  (dengan `roles: ["checker"]`, bukan `["organizer"]`) plus
  `tokenType`/`accessToken`/`refreshToken`/`expiresIn`/`expiresAt`. Konsol
  memakai token ini untuk membuka sesi lewat fungsi sign-in yang sama yang
  dipakai pendaftaran host, lalu mengarahkan ke `/organizer/check-in` —
  bukan dashboard, karena `roles` cuma berisi `checker`.

  Token ini juga **dipakai oleh script after-response request ini** untuk
  menimpa `accessToken`/`refreshToken` di environment aktif, sama seperti
  **Auth → Login**/**Register Host** — supaya request berikutnya (**Checker
  Me**, atau **Check-in → Checkin Scan**) bisa langsung dicoba sebagai akun
  checker ini. Jalankan **Auth → Login** lagi sesudahnya kalau mau kembali
  menguji sebagai host.

  ## Token undangan sekali pakai

  Sama seperti **Checker Invite Lookup**: token yang tidak ada, kedaluwarsa,
  atau sudah pernah dipakai untuk membuat akun dijawab `404`, bentuknya
  identik dengan contoh kedua di request itu. Setelah `complete` berhasil,
  token yang sama **tidak boleh bisa dipakai lagi** — baik untuk `lookup`
  maupun `complete` kedua kalinya.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `404` | `shared/common/error-not-found.response.json` | Token tidak ada, kedaluwarsa, atau sudah dipakai. |
  | `422` | (lihat contoh kedua) | `password`/`passwordConfirmation` tidak memenuhi aturan, atau `fullName` kosong. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  ## Konvensi yang berlaku

  - **`roles`** adalah array — `["checker"]` di sini, bukan string tunggal.
  - Envelope error: `{ success: false, message, data: null, meta: null, error: { code, errors } }`.

  Selengkapnya di `dto/README.md` §"Staff check-in (checker)".
