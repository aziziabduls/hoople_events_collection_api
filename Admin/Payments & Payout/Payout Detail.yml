docs: |
  # Payout Detail

  Satu pencairan, untuk **drawer "Payout Detail"** yang muncul dari kanan
  ketika "View Detail" ditekan di tab Payout History.

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/org/payouts/:id` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/organizer/payout-detail.response.json` |
  | **Path param** | `:id` - salin `id` dari salah satu baris **Payout List** ke URL. |
  | **Status** | Belum ada. Sampai ada, drawer memakai baris dari Payout List. |

  ## Isi drawer, bagian per bagian

  | Bagian di layar | Field |
  | --- | --- |
  | Judul + pil status | `experienceTitle`, `experienceKind`, `eventEndsAt`, `status` |
  | Payout ID / Payout Date | `reference`, `paidAt` (atau `settledOn` kalau belum cair) |
  | **Revenue Summary** | `ticketsSold`, `gross` |
  | **Fee Information** | `platformFee` + kalimat tetap "dibayar peserta, tidak dipotong" |
  | **Your Cost** | `gatewayFee`, `refunds`, `adjustment` |
  | **Net Payout (To You)** | `net` + satu kalimat yang mengikuti `status` |
  | **Payout Destination** | `bankAccount` (objek, lihat di bawah) |
  | **Timeline** | `timeline[]` |

  ## `bankAccount` di sini adalah objek, bukan string

  Di Payout List `bankAccount` boleh string ringkas (`"BCA ****7890"`). Di
  detail, drawer menampilkan kartu bank lengkap, jadi kirim objek:

  ```json
  "bankAccount": {
    "bankName": "Bank Central Asia",
    "accountNumberMasked": "**** **** **** 1234",
    "accountHolderName": "Adriani Ajeng",
    "isVerified": true
  }
  ```

  Kirim **nomor yang sudah disamarkan**, bukan nomor penuh — layar tidak
  pernah menampilkannya utuh dan tidak ada gunanya nomor itu melewati
  jaringan. Kalau field ini tidak dikirim, drawer memakai rekening dari
  `GET /org/settings`.

  ## `timeline` — empat langkah

  Konsol sudah bisa menyusun empat langkah ini sendiri dari `status`,
  `eventEndsAt`, `settledOn` dan `paidAt`. Kirim `timeline` hanya kalau
  backend tahu lebih banyak (mis. kapan review manual dimulai). Bentuknya:

  ```json
  { "step": "paid", "label": "Paid to your account",
    "at": "2026-03-06T14:02:00+07:00", "state": "done" }
  ```

  | `step` | Arti |
  | --- | --- |
  | `event_completed` | Event ditandai selesai |
  | `settlement_calculated` | Perhitungan potongan selesai |
  | `payout_processed` | Dana diproses / siap cair / ditahan |
  | `paid` | Masuk rekening, atau gagal |

  `state`: `done | current | pending | failed`. `at` boleh `null` untuk
  langkah yang belum terjadi.

  ## `404`

  Kalau `id` tidak ada, atau pencairannya milik workspace lain, jawab `404`
  dengan envelope error biasa — jangan `200` dengan `data: null`. Konsol
  membedakan "tidak ketemu" dari "server bermasalah" dan mengatakannya berbeda.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `403` | `shared/common/error-forbidden.response.json` | Akun tidak punya peran `organizer`. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "from": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `eventEndsAt`) ISO 8601 `+07:00`; tanggal polos `YYYY-MM-DD`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **Paginasi** `page` / `perPage`, dan `meta` berisi `{ page, perPage, total, totalPages }`.

  Selengkapnya di `dto/README.md`.
