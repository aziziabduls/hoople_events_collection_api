info:
  name: Payout Detail
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/org/payouts/po-0001-4aaa-8bbb-000000000001"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"
  scripts:
    - type: tests
      code: |-
        test("envelope lengkap", function () {
          const body = res.getBody();
          expect(res.getStatus()).to.be.below(400);
          expect(body).to.have.property("success", true);
          expect(body).to.have.property("data");
        });

        test("detail membawa rincian yang dibaca drawer", function () {
          const payout = res.getBody().data;
          ["id", "reference", "experienceTitle", "status", "gross", "platformFee",
           "gatewayFee", "net"].forEach(function (key) {
            expect(payout, key).to.have.property(key);
          });
        });

        test("timeline urut dan berlabel", function () {
          const steps = res.getBody().data.timeline;
          if (!steps) return;
          expect(steps).to.be.an("array");
          steps.forEach(function (step) {
            expect(step).to.have.property("step");
            expect(step).to.have.property("state");
            expect(["done", "current", "pending", "failed"]).to.include(step.state);
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

