docs: |
  # Payout List

  Satu baris per pencairan. **Ini endpoint terpenting di folder ini** — dua tab
  konsol (Overview dan Payout History) dan seluruh angka ringkasnya berasal
  dari sini.

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/org/payouts` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/organizer/payout-list.response.json` |
  | **Status** | Belum hidup di deployment mana pun per 2026-09-17 (404). |

  ## Query parameter

  | Parameter | Contoh | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `page` | `1` | tidak | Mulai 1. |
  | `perPage` | `100` | tidak | Konsol meminta 100 sekali lalu menyaring sendiri di browser. Kalau workspace bisa punya ratusan pencairan, kabari — konsol akan pindah ke paginasi server. |
  | `status` | `paid` | tidak | Salah satu dari empat status. |
  | `from` / `to` | `2026-03-01` | tidak | Rentang **tanggal selesai event** (`eventEndsAt`), bukan tanggal cair. |
  | `q` | `jazz` | tidak | Cari pada nama event. |

  Keempat yang opsional itu saat ini dikerjakan konsol sendiri. Kalau backend
  mengimplementasikannya, konsol akan mengirimnya dan hasilnya tetap sama —
  tidak ada perubahan layar yang diperlukan.

  ## Field per baris

  | Field | Tipe | Wajib | Dipakai di mana |
  | --- | --- | --- | --- |
  | `id` | UUID | ya | Kunci baris; dipakai `GET /org/payouts/:id`. |
  | `reference` | string | ya | "Payout ID" di drawer, mis. `PO-260719-01`. |
  | `experienceTitle` | string | ya | Kolom Event. |
  | `experienceKind` | `offline \| online \| hybrid` | tidak | Baris kedua kolom Event ("Offline Event"). |
  | `eventEndsAt` | instant | tidak | Kolom "Event End Date" **dan** dasar filter tanggal. Tanpa ini kolomnya "-" dan rentang tanggal tidak menyaring baris tersebut. |
  | `status` | enum | ya | Pil status, tile, dan timeline. |
  | `settledOn` | `YYYY-MM-DD` \| null | ya | Tanggal cair yang dijadwalkan. |
  | `paidAt` | instant \| null | ya | Kapan benar-benar cair. Wajib terisi kalau `status = paid`. |
  | `gross` | money | ya | "Gross Revenue". |
  | `platformFee` | money | ya | Fee Hoople yang **dibayar peserta**, ditampilkan sebagai informasi, tidak dikurangkan. |
  | `gatewayFee` | money | ya | "Payment Processing Fee (Your Cost)" — dikurangkan. |
  | `refunds` | money | tidak | Refund yang disetujui; dikurangkan. Default 0. |
  | `adjustment` | money | tidak | Koreksi manual admin; **ditambahkan** (boleh negatif). Default 0. |
  | `net` | money | ya | Angka hijau di tabel dan dasar semua total. |
  | `ticketsSold` | integer | tidak | "Tickets Sold" di drawer. |
  | `bankAccount` | string | tidak | Ringkas, mis. `BCA ****7890`. Drawer memakai rekening dari `GET /org/settings` kalau ini kosong. |
  | `holdReason` | string \| null | ya | Wajib terisi kalau `status = on_hold`; ditampilkan apa adanya. |

  Yang bertanda "tidak" boleh absen — konsol membacanya kalau ada dan memakai
  nol/kosong kalau tidak. Yang bertanda "ya" kalau hilang membuat barisnya
  tampil tidak lengkap, bukan error.

  ## Aturan uang

  ```
  net = gross − gatewayFee − refunds + adjustment
  ```

  `platformFee` tidak ikut dikurangi (dibayar peserta), **kecuali**
  `fee.feeBearer = "organizer"` di `GET /org/settings` — saat itu backend yang
  memotong dan `net` yang dikirim sudah bersih. Test di request ini memeriksa
  rumus tersebut baris per baris, jadi kalau organizer menanggung fee dan
  angkanya berbeda, test itu akan gagal dan itu memang sinyal yang diinginkan.

  ## Baris kosong

  Workspace baru menjawab `data: []` dengan `meta.total: 0`. Itu ditangani —
  layar menampilkan "No payouts yet", bukan angka demo. Jangan kirim baris
  contoh untuk workspace yang belum punya pencairan.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `403` | `shared/common/error-forbidden.response.json` | Akun tidak punya peran `organizer`. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "from": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `eventEndsAt`) ISO 8601 `+07:00`; tanggal polos `YYYY-MM-DD`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **Paginasi** `page` / `perPage`, dan `meta` berisi `{ page, perPage, total, totalPages }`.

  Selengkapnya di `dto/README.md`.
