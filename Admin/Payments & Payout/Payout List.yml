info:
  name: Payout List
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/org/payouts"
  auth: inherit
  params:
    - name: page
      value: "1"
      type: query
      description: "Nomor halaman, mulai 1. Diturunkan dari `meta`."
    - name: perPage
      value: "10"
      type: query
      description: "Baris per halaman. Konsol meminta 100 dan menyaring sendiri."
runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"
  scripts:
    - type: tests
      code: |-
        test("envelope lengkap", function () {
          const body = res.getBody();
          expect(res.getStatus()).to.be.below(400);
          expect(body).to.have.property("success", true);
          expect(body).to.have.property("message");
          expect(body).to.have.property("data");
          expect(body).to.have.property("meta");
        });

        test("meta paginasi konsisten", function () {
          const meta = res.getBody().meta;
          expect(meta).to.have.property("page");
          expect(meta).to.have.property("perPage");
          expect(meta).to.have.property("total");
          expect(meta.totalPages).to.equal(Math.ceil(meta.total / meta.perPage));
        });

        test("tiap baris punya field yang dibaca layar", function () {
          const rows = res.getBody().data;
          if (!rows.length) return;
          const row = rows[0];
          ["id", "reference", "experienceTitle", "status", "gross", "platformFee",
           "gatewayFee", "net"].forEach(function (key) {
            expect(row, key).to.have.property(key);
          });
          expect(["scheduled", "paid", "on_hold", "failed"]).to.include(row.status);
        });

        test("net = gross - gatewayFee - refunds + adjustment", function () {
          const rows = res.getBody().data;
          rows.forEach(function (row) {
            const money = function (value) { return value && typeof value.amount === "number" ? value.amount : 0; };
            const expected = money(row.gross) - money(row.gatewayFee) - money(row.refunds) + money(row.adjustment);
            expect(money(row.net), row.reference).to.equal(expected);
          });
        });

        test("status yang butuh penjelasan membawanya", function () {
          res.getBody().data.forEach(function (row) {
            if (row.status === "paid") expect(row.paidAt, row.reference).to.not.equal(null);
            if (row.status === "on_hold") expect(row.holdReason, row.reference).to.not.equal(null);
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

