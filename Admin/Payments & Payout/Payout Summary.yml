info:
  name: Payout Summary
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/org/payouts/summary"
  auth: inherit
  params:
    - name: from
      value: "2026-01-01"
      type: query
      description: "Awal periode, `YYYY-MM-DD`. Difilter pada tanggal selesai event."
    - name: to
      value: "2026-12-31"
      type: query
      description: "Akhir periode, `YYYY-MM-DD`."

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"
  scripts:
    - type: tests
      code: |-
        test("envelope lengkap", function () {
          const body = res.getBody();
          expect(res.getStatus()).to.be.below(400);
          expect(body).to.have.property("success", true);
          expect(body).to.have.property("data");
        });

        test("periode dikembalikan apa adanya", function () {
          const data = res.getBody().data;
          expect(data).to.have.property("period");
          expect(data.period).to.have.property("from");
          expect(data.period).to.have.property("to");
        });

        test("empat status hadir semua", function () {
          const status = res.getBody().data.status;
          ["paid", "scheduled", "onHold", "failed"].forEach(function (key) {
            expect(status, key).to.have.property(key);
            expect(status[key]).to.have.property("count");
            expect(status[key]).to.have.property("amount");
          });
        });

        test("netPayout = gross - refunds - gatewayFee + adjustment", function () {
          const data = res.getBody().data;
          const money = function (value) { return value && typeof value.amount === "number" ? value.amount : 0; };
          const expected = money(data.gross) - money(data.refunds) - money(data.gatewayFee) + money(data.adjustment);
          expect(money(data.netPayout)).to.equal(expected);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Sukses"
    response:
