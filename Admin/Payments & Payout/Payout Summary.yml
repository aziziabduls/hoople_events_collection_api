docs: |
  # Payout Summary

  Total satu periode, untuk halaman **`/organizer/payments/summary`** — halaman
  tersendiri yang dibuka tombol "See Details →" pada kartu Net Payout.

  | | |
  | --- | --- |
  | **Method** | `GET` |
  | **Path** | `/org/payouts/summary` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/organizer/payout-summary.response.json` |
  | **Status** | Belum ada. Sampai ada, konsol menjumlah sendiri dari Payout List. |

  ## Kenapa endpoint sendiri, padahal bisa dijumlah di klien

  Karena penjumlahan klien hanya seakurat baris yang sempat terambil. Begitu
  satu workspace punya lebih banyak pencairan daripada satu halaman, total
  yang ditampilkan jadi total halaman itu — bukan total periode. Endpoint ini
  yang membuat angkanya benar tanpa menarik seluruh riwayat ke browser.

  Selama endpoint ini 404, konsol tetap menghitung sendiri; tidak ada layar
  kosong.

  ## Isi halaman, bagian per bagian

  | Bagian di layar | Field |
  | --- | --- |
  | Angka besar "Total Net Payout" | `netPayout` |
  | Baris kecil di bawahnya | `payoutCount`, `period` |
  | **Payout Status Summary** (4 tile) | `status.paid`, `status.scheduled`, `status.onHold`, `status.failed` — masing-masing `{ count, amount }` |
  | **Financial Breakdown** (5 baris) | `gross`, `platformFee`, `gatewayFee`, `refunds`, `adjustment` |
  | **Net Payout Calculation** | field yang sama, dijumlah ulang di layar |

  ## Satu aturan yang tidak boleh dilanggar

  **Semua angka rincian dihitung tanpa pencairan berstatus `failed`.**

  Alasannya konkret: kalau gross ikut menghitung event yang transfernya gagal,
  kotak "Net Payout Calculation" berakhir pada angka yang berbeda dari angka
  besar di atasnya, dan pembaca tidak punya cara tahu mana yang benar. Uang
  yang gagal ditransfer dilaporkan terpisah di `status.failed` — itu saja.

  Jadi: `gross`, `platformFee`, `gatewayFee`, `refunds`, `adjustment`, dan
  `netPayout` semuanya atas pencairan `paid + scheduled + on_hold`, sedangkan
  `status.failed` berdiri sendiri. `payoutCount` menghitung **seluruh**
  pencairan pada periode itu, termasuk yang gagal.

  ## Periode

  `from` dan `to` menyaring pada **tanggal selesai event** (`eventEndsAt`),
  sama seperti filter di tabel riwayat — bukan tanggal cair. Kalau keduanya
  tidak dikirim, jawab untuk seluruh riwayat workspace dan kembalikan rentang
  sebenarnya di `period`, karena halamannya menampilkan rentang itu.

  Kembalikan `period` apa adanya: layar menampilkannya ("1 Mar 2026 – 25 Jul
  2026"), jadi backend dan layar harus menyebut periode yang sama.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `shared/common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `403` | `shared/common/error-forbidden.response.json` | Akun tidak punya peran `organizer`. |
  | `500` | `shared/common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "from": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `eventEndsAt`) ISO 8601 `+07:00`; tanggal polos `YYYY-MM-DD`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **Paginasi** `page` / `perPage`, dan `meta` berisi `{ page, perPage, total, totalPages }`.

  Selengkapnya di `dto/README.md`.
