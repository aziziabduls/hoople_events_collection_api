info:
  name: Event Detail
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/teams/events/{id}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

