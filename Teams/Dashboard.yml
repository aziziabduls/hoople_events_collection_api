docs: |-
  ## Dashboard

  Organisasi, event aktif, statistik, aktivitas terbaru.

  **GET** `/teams/dashboard`

  - Response: `dto/teams/dashboard.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
