info:
  name: Settings
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/teams/settings"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

