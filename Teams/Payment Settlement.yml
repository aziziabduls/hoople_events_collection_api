docs: |-
  ## Payment Settlement

  Dana terkumpul, potongan, tahapan pencairan.

  **GET** `/teams/payments?eventId=`

  - Response: `dto/teams/payment-settlement.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

