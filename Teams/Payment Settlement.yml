info:
  name: Payment Settlement
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/teams/payments?eventId=f00d1e00-1111-4222-8333-000000000601"
  auth: inherit
  params:
    - name: eventId
      value: f00d1e00-1111-4222-8333-000000000601
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

