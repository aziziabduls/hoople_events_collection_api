docs: |-
  ## Event Create

  Buat event internal.

  **POST** `/teams/events`

  - Request: `dto/teams/event-create.request.json`
  - Response: `dto/teams/event-create.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

