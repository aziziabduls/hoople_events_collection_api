info:
  name: Profile
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/teams/profile"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

examples:
  - name: Sukses
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Profil anggota berhasil diambil",
            "data": {
              "id": "3f8a1c22-9d41-4b7e-8f0a-11c2d3e4f501",
              "name": "Adriani Ajeng",
              "email": "adriani.ajeng@sinarnusantara.co.id",
              "phone": "+62 812 3456 7890",
              "employeeId": "SN-0042",
              "department": "People Ops",
              "title": "People Ops Lead",
              "roles": [
                "participant",
                "teams_admin"
              ],
