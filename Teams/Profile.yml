docs: |-
  ## Profile

  Profil anggota + riwayat kehadiran.

  **GET** `/teams/profile`

  - Response: `dto/teams/profile.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
