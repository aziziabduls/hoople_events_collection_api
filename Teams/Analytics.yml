docs: |-
  ## Analytics

  Funnel, respons per departemen, tren, kurva check-in.

  **GET** `/teams/analytics?eventId=`

  - Response: `dto/teams/analytics.response.json`

  Envelope: `{ success, message, data, meta }`. Uang di response berbentuk
  `{ amount, currency }`; di request integer polos. Enum lowercase.

