info:
  name: Settings Update
  type: http
  seq: 14

http:
  method: PATCH
  url: "{{baseUrl}}/teams/settings"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "organization": {
          "name": "Sinar Nusantara",
          "legalName": "PT Sinar Nusantara Digital",
          "city": "Jakarta Selatan",
          "domain": "sinarnusantara.co.id"
        },
        "membership": {
          "rule": "email_domain",
          "allowedDomains": [
            "sinarnusantara.co.id"
          ],
          "requireCompanySignIn": true,
          "autoApprove": true
        },
        "collections": {
          "bankName": "BCA",
          "accountNumber": "1122334821",
          "accountHolder": "PT Sinar Nusantara Digital",
          "disbursement": "after_event",
          "payoutSchedule": "weekly"
        }
      }

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"
    - expression: res.body.success
      operator: eq
      value: "true"

docs: |-
  # Settings Update

  Simpan pengaturan.

  | | |
  | --- | --- |
  | **Method** | `PATCH` |
  | **Path** | `/teams/settings` |
  | **Auth** | Wajib — `Authorization: Bearer <accessToken>` |
  | **Sukses** | `200 OK` |
  | **Sumber** | `dto/teams/settings-update.request.json` |

  ## Request body

  `application/json`

  | Field | Tipe | Wajib | Catatan |
  | --- | --- | --- | --- |
  | `organization` | object | ya |  |
  | `organization.name` | string | ya |  |
  | `organization.legalName` | string | ya |  |
  | `organization.city` | string | ya |  |
  | `organization.domain` | string | ya |  |
  | `membership` | object | ya |  |
  | `membership.rule` | string | ya | enum `membershipRule`: `email_domain`, `invite_only`, `manual` |
  | `membership.allowedDomains` | string[] | ya |  |
  | `membership.requireCompanySignIn` | boolean | ya |  |
  | `membership.autoApprove` | boolean | ya |  |
  | `collections` | object | ya |  |
  | `collections.bankName` | string | ya |  |
  | `collections.accountNumber` | string | ya |  |
  | `collections.accountHolder` | string | ya |  |
  | `collections.disbursement` | string | ya | enum `disbursement`: `after_event`, `weekly`, `manual` |
  | `collections.payoutSchedule` | string | ya | enum `disbursement`: `after_event`, `weekly`, `manual` |


  > Kolom **Wajib** diturunkan dari contoh: field yang bernilai `null`
  > dianggap opsional. Aturan validasi sesungguhnya ditentukan backend.

  ## Error yang mungkin

  | Kode | Contoh | Kapan |
  | --- | --- | --- |
  | `401` | `common/error-unauthorized.response.json` | Token tidak ada atau kedaluwarsa. |
  | `422` | `common/error-validation.response.json` | Validasi gagal; pesan per field ada di `error.errors`. |
  | `403` | `common/error-forbidden.response.json` | Akun tidak punya peran untuk konsol ini. |
  | `500` | `common/error-server.response.json` | Kesalahan tak terduga. |

  Semua error memakai envelope yang sama ditambah blok `error`:

  ```json
  { "success": false, "message": "…", "data": null, "meta": null,
    "error": { "code": "VALIDATION_ERROR", "errors": { "email": ["…"] } } }
  ```

  ## Konvensi yang berlaku

  - **Nama field** camelCase.
  - **Uang** di response berbentuk `{ amount: integer, currency: "IDR" }`; di request integer polos.
  - **Instant** (`createdAt`, `paidAt`, `startsAt`, `expiresAt`) ISO 8601 `+07:00`. Jam sesi berulang tetap `"HH:mm"`.
  - **Enum** lowercase. Label berhuruf besar adalah urusan frontend.
  - **Field nullable** tetap dikirim sebagai `null`, jangan dihilangkan.
  - **`roles`** adalah array — satu akun bisa `["participant", "organizer"]`.

  Selengkapnya di `dto/README.md`.

